<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">

<head>
    <title>사용자 설정</title>
</head>

<body layout:fragment="content">
    <div class="max-w-4xl mx-auto space-y-6" x-data="settingsApp()">

        <!-- Header Card -->
        <div class="card bg-base-100 shadow-md">
            <div class="card-body">
                <h1 class="text-3xl font-bold text-base-content">⚙️ 사용자 설정</h1>
                <p class="text-base-content/60 mt-2">계정 정보 및 화면 설정을 관리합니다.</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <!-- Theme Settings Card -->
            <div class="card bg-base-100 shadow-md">
                <div class="card-body">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="badge badge-primary badge-lg">
                            🎨
                        </div>
                        <h2 class="text-xl font-semibold text-base-content">UI 테마 설정</h2>
                    </div>

                    <div class="space-y-4">
                        <!-- Theme Select -->
                        <div class="form-control w-full">
                            <label class="label">
                                <span class="label-text font-medium">테마 선택</span>
                            </label>
                            <select x-model="theme" @change="updateTheme()"
                                class="select select-bordered w-full focus:select-primary"
                                title="테마 선택">
                                <optgroup label="Kalpa 테마">
                                    <option value="kalpa-light">☀️ Kalpa Light (밝은 테마)</option>
                                    <option value="kalpa-dark">🌙 Kalpa Dark (어두운 테마)</option>
                                </optgroup>
                                <optgroup label="기본 테마">
                                    <option value="light">☀️ Light (밝음)</option>
                                    <option value="dark">🌙 Dark (어두움)</option>
                                </optgroup>
                                <optgroup label="특수 테마">
                                    <option value="corporate">💼 Corporate (기업)</option>
                                    <option value="dracula">🧛 Dracula (드라큘라)</option>
                                </optgroup>
                            </select>
                        </div>

                        <!-- Info Alert -->
                        <div class="alert alert-info">
                            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/>
                            </svg>
                            <span class="text-sm">테마 설정은 계정에 저장되며, 모든 기기에서 동기화됩니다.</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Password Change Card -->
            <div class="card bg-base-100 shadow-md">
                <div class="card-body">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="badge badge-secondary badge-lg">
                            🔑
                        </div>
                        <h2 class="text-xl font-semibold text-base-content">비밀번호 변경</h2>
                    </div>

                    <form @submit.prevent="changePassword" class="space-y-4">
                        <!-- Current Password -->
                        <div class="form-control w-full">
                            <label class="label">
                                <span class="label-text font-medium">현재 비밀번호</span>
                            </label>
                            <input type="password" x-model="passwordForm.currentPassword" required
                                class="input input-bordered w-full focus:input-primary"
                                placeholder="현재 비밀번호를 입력하세요">
                        </div>

                        <!-- New Password -->
                        <div class="form-control w-full">
                            <label class="label">
                                <span class="label-text font-medium">새 비밀번호</span>
                            </label>
                            <input type="password" x-model="passwordForm.newPassword" required
                                class="input input-bordered w-full focus:input-primary"
                                placeholder="새로운 비밀번호를 입력하세요">
                        </div>

                        <!-- Confirm Password -->
                        <div class="form-control w-full">
                            <label class="label">
                                <span class="label-text font-medium">비밀번호 확인</span>
                            </label>
                            <input type="password" x-model="passwordForm.confirmPassword" required
                                class="input input-bordered w-full focus:input-primary"
                                placeholder="새로운 비밀번호를 다시 입력하세요">
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-2">
                            <button type="submit"
                                class="btn btn-primary w-full"
                                :disabled="isLoading"
                                :class="{'loading': isLoading}">
                                <span x-show="!isLoading">비밀번호 변경</span>
                                <span x-show="isLoading">처리 중...</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script th:inline="javascript">
            function settingsApp() {
                return {
                    theme: localStorage.getItem('theme') || 'kalpa-light',
                    passwordForm: {
                        currentPassword: '',
                        newPassword: '',
                        confirmPassword: ''
                    },
                    isLoading: false,
                    csrfToken: document.querySelector("meta[name='_csrf']").getAttribute("content"),
                    csrfHeader: document.querySelector("meta[name='_csrf_header']").getAttribute("content"),

                    async init() {
                        this.loadSettings();
                    },

                    async loadSettings() {
                        try {
                            const response = await fetch('/api/settings', {
                                method: 'GET',
                                headers: {
                                    'Content-Type': 'application/json'
                                }
                            });
                            if (response.ok) {
                                const data = await response.json();
                                this.theme = data.settings['ui-theme'] || localStorage.getItem('theme') || 'kalpa-light';
                                document.documentElement.setAttribute('data-theme', this.theme);
                            }
                        } catch (error) {
                            console.error('Failed to load settings:', error);
                        }
                    },

                    async updateTheme() {
                        try {
                            // localStorage에 저장
                            localStorage.setItem('theme', this.theme);
                            // HTML에 data-theme 속성 설정
                            document.documentElement.setAttribute('data-theme', this.theme);

                            const response = await fetch('/api/settings/theme', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    [this.csrfHeader]: this.csrfToken
                                },
                                body: JSON.stringify({ theme: this.theme })
                            });

                            if (response.ok) {
                                // 성공 알림 표시
                                this.$nextTick(() => {
                                    const modal = document.createElement('div');
                                    modal.className = 'alert alert-success';
                                    modal.innerHTML = '<span>테마가 변경되었습니다.</span>';
                                });
                            }
                        } catch (error) {
                            console.error('Failed to update theme:', error);
                        }
                    },

                    async changePassword() {
                        if (this.passwordForm.newPassword !== this.passwordForm.confirmPassword) {
                            alert('새 비밀번호가 일치하지 않습니다.');
                            return;
                        }

                        this.isLoading = true;
                        try {
                            const response = await fetch('/api/settings/password', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    [this.csrfHeader]: this.csrfToken
                                },
                                body: JSON.stringify({
                                    currentPassword: this.passwordForm.currentPassword,
                                    newPassword: this.passwordForm.newPassword
                                })
                            });

                            if (response.ok) {
                                alert('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
                                window.location.href = '/logout';
                            } else {
                                const errorText = await response.text();
                                alert('비밀번호 변경 실패: ' + (errorText || '현재 비밀번호를 확인해주세요.'));
                            }
                        } catch (error) {
                            console.error('Failed to change password:', error);
                            alert('오류가 발생했습니다.');
                        } finally {
                            this.isLoading = false;
                            this.passwordForm.currentPassword = '';
                            this.passwordForm.newPassword = '';
                            this.passwordForm.confirmPassword = '';
                        }
                    }
                }
            }
        </script>
    </th:block>
</body>

</html>
