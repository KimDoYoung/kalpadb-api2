<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>장비 상세 - KalpaDB</title>
    <!-- QuillJS CSS (읽기 전용 스타일링) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
<main layout:fragment="content">
    <div x-data="jangbiDetail()" x-init="init()">
        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-8">
            <div class="loading loading-spinner loading-lg text-primary"></div>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="alert alert-error mb-6">
            <p x:text="error"></p>
        </div>

        <!-- 장비 상세 -->
        <div x-show="!loading && jangbi" class="space-y-6">
            <!-- 헤더 -->
            <div class="flex justify-between items-start border-b border-base-300 pb-4">
                <div>
                    <h2 class="text-3xl font-bold text-base-content" x-text="jangbi.item"></h2>
                    <p class="text-base-content/60 mt-2">
                        <span class="font-medium">구입일:</span> <span x-text="formatDate(jangbi.ymd)"></span>
                    </p>
                </div>
                <div class="flex gap-2">
                    <a :href="'/jangbi/' + jangbi.id + '/edit'" class="btn btn-primary">수정</a>
                    <button type="button" @click="deleteJangbi()" class="btn btn-error">삭제</button>
                </div>
            </div>

            <!-- 기본 정보 -->
            <div class="bg-base-100 rounded-lg p-6 grid grid-cols-2 gap-6">
                <!-- 왼쪽 컬럼 -->
                <div class="space-y-4">
                    <div>
                        <label class="label">
                            <span class="label-text text-base-content">위치</span>
                        </label>
                        <p class="text-base-content" x-text="jangbi.location || '-'"></p>
                    </div>
                    <div>
                        <label class="label">
                            <span class="label-text text-base-content">가격</span>
                        </label>
                        <p class="text-base-content" x-text="formatCost(jangbi.cost)"></p>
                    </div>
                </div>

                <!-- 오른쪽 컬럼 -->
                <div class="space-y-4">
                    <div>
                        <label class="label">
                            <span class="label-text text-base-content">중요도</span>
                        </label>
                        <p x-text="getLvlText(jangbi.lvl)" :class="getLvlClass(jangbi.lvl)"></p>
                    </div>
                    <div>
                        <label class="label">
                            <span class="label-text text-base-content">수정일</span>
                        </label>
                        <p class="text-base-content/60 text-sm" x-text="formatDateTime(jangbi.modifyDt)"></p>
                    </div>
                </div>
            </div>

            <!-- 스펙/특징 -->
            <template x-if="jangbi.spec">
                <div class="bg-base-100 rounded-lg p-6">
                    <h3 class="text-lg font-bold text-base-content mb-4">📋 스펙/특징</h3>
                    <div class="ql-editor prose prose-sm max-w-none" x-html="jangbi.spec"></div>
                </div>
            </template>

            <!-- 첨부파일 -->
            <div class="border-t pt-6">
                <h3 class="text-lg font-bold text-base-content mb-4">📎 첨부파일</h3>
                <template x-if="attachedFiles.length > 0">
                    <div class="space-y-2">
                        <template x-for="file in attachedFiles" :key="file.fileId">
                            <div class="flex items-center justify-between bg-base-200 p-3 rounded border border-base-300">
                                <div class="flex-1">
                                    <a :href="'/api/file/download/' + file.fileId"
                                       class="link link-primary font-medium"
                                       x-text="file.orgFileName">
                                    </a>
                                    <p class="text-xs text-base-content/60" x-text="'(' + formatFileSize(file.fileSize) + ')'"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
                <template x-if="attachedFiles.length === 0">
                    <p class="text-base-content/60">첨부파일이 없습니다.</p>
                </template>
            </div>

            <!-- 뒤로가기 -->
            <div class="flex justify-between items-center">
                <a th:href="@{/jangbi}" class="link link-primary">← 목록으로</a>
            </div>
        </div>
    </div>

    <script>
        function jangbiDetail() {
            const pathParts = window.location.pathname.split('/');
            const id = pathParts[pathParts.length - 1];

            return {
                id: id,
                jangbi: null,
                attachedFiles: [],
                loading: true,
                error: '',

                async init() {
                    try {
                        const response = await fetch(`/api/jangbi/${this.id}`);
                        if (!response.ok) {
                            throw new Error('장비를 불러올 수 없습니다.');
                        }
                        const data = await response.json();
                        this.jangbi = data.data || data;

                        // 첨부파일 로드
                        await this.loadAttachedFiles();
                    } catch (err) {
                        this.error = err.message;
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },

                async loadAttachedFiles() {
                    try {
                        console.log(`첨부파일 로드 시작: /api/jangbi/${this.id}/files`);
                        const response = await fetch(`/api/jangbi/${this.id}/files`);
                        if (response.ok) {
                            const data = await response.json();
                            console.log('첨부파일 로드 성공:', data);
                            this.attachedFiles = data.data || [];
                            console.log(`로드된 파일 개수: ${this.attachedFiles.length}`);
                        } else {
                            console.warn(`첨부파일 조회 실패: ${response.status}`);
                        }
                    } catch (err) {
                        console.error('파일 로드 실패:', err);
                    }
                },

                async deleteJangbi() {
                    if (confirm('정말 삭제하시겠습니까? (첨부파일은 보존됩니다)')) {
                        try {
                            const response = await fetch(`/api/jangbi/${this.id}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });
                            if (response.ok) {
                                alert('삭제되었습니다.');
                                window.location.href = '/jangbi';
                            } else {
                                throw new Error('삭제에 실패했습니다.');
                            }
                        } catch (err) {
                            alert(err.message);
                            console.error(err);
                        }
                    }
                },

                formatDate(ymd) {
                    if (!ymd || ymd.length !== 8) return ymd;
                    return `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
                },

                formatDateTime(dateTimeString) {
                    if (!dateTimeString) return '-';
                    try {
                        const date = new Date(dateTimeString);
                        return date.toLocaleString('ko-KR');
                    } catch (e) {
                        return dateTimeString;
                    }
                },

                formatCost(cost) {
                    if (!cost) return '-';
                    return cost.toLocaleString('ko-KR') + ' 원';
                },

                getLvlText(lvl) {
                    const levels = {
                        '1': '1 - 높음 (중요)',
                        '2': '2 - 중간',
                        '3': '3 - 낮음'
                    };
                    return levels[lvl] || lvl;
                },

                getLvlClass(lvl) {
                    const classes = {
                        '1': 'badge badge-red',
                        '2': 'badge badge-yellow',
                        '3': 'badge badge-green'
                    };
                    return classes[lvl] || 'badge badge-gray';
                },

                formatFileSize(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
                }
            }
        }
    </script>
</main>
</body>
</html>
