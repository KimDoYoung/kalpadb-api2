<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">

<head>
    <title>게시판 - KalpaDB</title>
</head>

<body>
    <main layout:fragment="content">
        <div x-data="boardsList()" x-init="init()">
            <!-- 페이지 헤더 -->
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-base-content">📋 게시판 관리</h2>
                <button type="button" @click="openCreateModal()" class="btn btn-primary flex items-center gap-2">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                    게시판 생성
                </button>
            </div>

            <style>
                [x-cloak] {
                    display: none !important;
                }
            </style>

            <!-- 로딩 상태 -->
            <div x-show="loading" class="text-center py-8">
                <div class="loading loading-spinner loading-lg text-primary"></div>
            </div>

            <!-- 에러 메시지 -->
            <div x-show="error"
                class="alert alert-error mb-6 flex justify-between items-center"
                x-cloak>
                <p x-text="error"></p>
                <button type="button" @click="error = ''" class="font-bold">&times;</button>
            </div>

            <!-- 게시판 목록 -->
            <template x-if="!loading && boards && boards.length > 0">
                <div class="grid grid-cols-3 gap-6">
                    <template x-for="(board, idx) in boards" :key="board.id || idx">
                        <div class="group relative card bg-base-100 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-1 overflow-hidden border border-base-300 cursor-pointer"
                             @click="window.location.href = '/posts?boardId=' + board.id">

                            <!-- Decorator Line -->
                            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left"></div>

                            <div class="p-6">
                                <div class="flex justify-between items-start mb-4">
                                    <div class="p-3 bg-primary/20 text-primary rounded-xl group-hover:bg-primary group-hover:text-primary-content transition-colors duration-300">
                                        <span class="text-2xl">📋</span>
                                    </div>
                                    <div class="flex gap-2">
                                        <button type="button" @click.stop="openEditModal(board)"
                                            class="p-2 text-base-content/40 hover:text-primary hover:bg-primary/10 rounded-lg transition-colors" title="수정">
                                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/>
                                            </svg>
                                        </button>
                                        <button type="button" @click.stop="deleteBoard(board.id)"
                                            class="p-2 text-base-content/40 hover:text-error hover:bg-error/10 rounded-lg transition-colors" title="삭제">
                                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <h3 class="text-xl font-bold text-base-content mb-2 group-hover:text-primary transition-colors" x-text="board.boardNameKor"></h3>
                                <div class="flex items-center gap-2 mb-4">
                                    <span class="px-2.5 py-1 rounded-md bg-base-200 text-xs font-medium text-base-content/60 font-mono"
                                          x-text="board.boardCode"></span>
                                    <span class="px-2.5 py-1 rounded-md text-xs font-medium"
                                          :class="{'bg-success/20 text-success': board.contentType === 'html', 'bg-warning/20 text-warning': board.contentType === 'markdown', 'bg-base-200 text-base-content': board.contentType === 'text'}"
                                          x-text="board.contentType.toUpperCase()"></span>
                                </div>
                                <p class="text-base-content/60 text-sm line-clamp-2 min-h-[2.5rem]" x-text="board.description || '설명이 없습니다.'"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- 빈 상태 -->
            <template x-if="!loading && (!boards || boards.length === 0)">
                <div class="text-center py-12 bg-base-200 rounded-lg">
                    <p class="text-base-content/60 text-lg mb-4">등록된 게시판이 없습니다.</p>
                    <button type="button" @click="openCreateModal()" class="link link-primary font-medium">
                        첫 번째 게시판을 생성해보세요
                    </button>
                </div>
            </template>

            <!-- CRUD Modal -->
            <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;" x-cloak>
                <div class="flex items-center justify-center min-h-screen text-center">
                    <!-- Background overlay -->
                    <div class="fixed inset-0 transition-opacity" aria-hidden="true" @click="closeModal()">
                        <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
                    </div>

                    <!-- Modal panel -->
                    <div
                        class="inline-block bg-base-100 rounded-lg text-left overflow-hidden shadow-xl transform transition-all my-8 align-middle max-w-lg w-full">
                        <div class="bg-base-100 p-6 pb-4">
                            <div class="flex items-start">
                                <div class="ml-4 text-left w-full">
                                    <h3 class="text-lg leading-6 font-medium text-base-content"
                                        x-text="isEdit ? '게시판 수정' : '새 게시판 생성'"></h3>
                                    <div class="mt-4 space-y-4">
                                        <!-- Board Code -->
                                        <div>
                                            <label class="label">
                                                <span class="label-text text-base-content">게시판 코드</span>
                                            </label>
                                            <input type="text" x-model="form.boardCode" :disabled="isEdit"
                                                class="input input-bordered w-full focus:input-primary"
                                                placeholder="예: notice (영문 소문자)">
                                            <p x-show="!isEdit" class="text-xs text-base-content/60 mt-1">한번 생성하면 변경할 수 없습니다.
                                            </p>
                                        </div>

                                        <!-- Board Name (Korean) -->
                                        <div>
                                            <label class="label">
                                                <span class="label-text text-base-content">게시판 이름</span>
                                            </label>
                                            <input type="text" x-model="form.boardNameKor"
                                                class="input input-bordered w-full focus:input-primary"
                                                placeholder="예: 공지사항">
                                        </div>

                                        <!-- Content Type -->
                                        <div>
                                            <label class="label">
                                                <span class="label-text text-base-content">콘텐츠 타입</span>
                                            </label>
                                            <select x-model="form.contentType" :disabled="isEdit"
                                                class="select select-bordered w-full focus:select-primary">
                                                <option value="html">HTML (에디터)</option>
                                                <option value="markdown">Markdown</option>
                                                <option value="text">Plain Text</option>
                                                <option value="json">JSON</option>
                                            </select>
                                        </div>

                                        <!-- Description -->
                                        <div>
                                            <label class="label">
                                                <span class="label-text text-base-content">설명</span>
                                            </label>
                                            <textarea x-model="form.description" rows="3"
                                                class="textarea textarea-bordered w-full focus:textarea-primary"
                                                placeholder="게시판에 대한 설명"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-base-200 px-6 py-3 flex flex-row-reverse">
                            <button type="button" @click="saveBoard()"
                                class="inline-flex justify-center rounded-md btn btn-primary ml-3 w-auto text-sm">
                                저장
                            </button>
                            <button type="button" @click="closeModal()"
                                class="inline-flex justify-center rounded-md btn btn-secondary ml-3 w-auto text-sm">
                                취소
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function boardsList() {
                return {
                    boards: [],
                    loading: true,
                    error: '',
                    showModal: false,
                    isEdit: false,
                    form: {
                        id: null,
                        boardCode: '',
                        boardNameKor: '',
                        contentType: 'html',
                        description: ''
                    },

                    init() {
                        if (this._initialized) return;
                        this._initialized = true;
                        this.loadBoards();
                    },

                    loadBoards() {
                        this.loading = true;
                        fetch('/api/boards')
                            .then(res => {
                                if (!res.ok) throw new Error('데이터 로드 실패');
                                return res.json();
                            })
                            .then(data => {
                                // Extract list from response structure
                                this.boards = Array.isArray(data.data) ? data.data : (Array.isArray(data) ? data : []);
                            })
                            .catch(err => this.error = err.message)
                            .finally(() => this.loading = false);
                    },

                    openCreateModal() {
                        this.isEdit = false;
                        this.form = {
                            id: null,
                            boardCode: '',
                            boardNameKor: '',
                            contentType: 'html',
                            description: ''
                        };
                        this.showModal = true;
                    },

                    openEditModal(board) {
                        this.isEdit = true;
                        this.form = {
                            id: board.id,
                            boardCode: board.boardCode,
                            boardNameKor: board.boardNameKor,
                            contentType: board.contentType,
                            description: board.description
                        };
                        this.showModal = true;
                    },

                    closeModal() {
                        this.showModal = false;
                        this.error = '';
                    },

                    saveBoard() {
                        const url = this.isEdit ? `/api/boards/${this.form.id}` : '/api/boards';
                        const method = this.isEdit ? 'PUT' : 'POST';

                        // Prepare payload
                        const payload = {
                            boardNameKor: this.form.boardNameKor,
                            description: this.form.description
                        };

                        // Add create-only fields
                        if (!this.isEdit) {
                            payload.boardCode = this.form.boardCode;
                            payload.contentType = this.form.contentType;
                        }

                        fetch(url, {
                            method: method,
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        })
                            .then(async res => {
                                const data = await res.json();
                                if (!res.ok) throw new Error(data.message || '저장 실패');
                                return data;
                            })
                            .then(() => {
                                this.closeModal();
                                this.loadBoards(); // Refresh list
                            })
                            .catch(err => {
                                alert(err.message);
                            });
                    },

                    deleteBoard(id) {
                        if (!confirm('정말 이 게시판을 삭제하시겠습니까?\n삭제 시 관련된 모든 게시글도 함께 삭제됩니다.')) return;

                        fetch(`/api/boards/${id}`, { method: 'DELETE' })
                            .then(async res => {
                                const data = await res.json();
                                if (!res.ok) throw new Error(data.message || '삭제 실패');
                                return data;
                            })
                            .then(() => {
                                this.loadBoards();
                            })
                            .catch(err => {
                                alert(err.message);
                            });
                    }
                }
            }
        </script>
    </main>
</body>

</html>
