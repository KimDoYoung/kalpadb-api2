<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>게시판 - KalpaDB</title>
</head>
<body>
<main layout:fragment="content">
    <div x-data="boardsList()" x-init="init()">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">📋 게시판</h2>
        </div>

        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-600">로딩 중...</p>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <p x:text="error"></p>
        </div>

        <!-- 게시판 목록 -->
        <template x-if="!loading && boards && boards.length > 0">
            <div class="space-y-4">
                <template x-for="(board, idx) in boards" :key="idx">
                    <div class="card hover:shadow-lg transition">
                        <div class="flex items-center gap-3">
                            <div class="flex-1">
                                <a :href="'/boards/' + board.id" class="block">
                                    <h3 class="text-lg font-bold text-gray-800" x-text="board.boardNameKor"></h3>
                                    <p class="text-gray-600 text-sm" x-text="board.description || '설명 없음'"></p>
                                    <p class="text-gray-500 text-xs mt-1">
                                        <span x-text="'콘텐츠 타입: ' + board.contentType"></span>
                                    </p>
                                </a>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <a :href="'/boards/' + board.id" class="btn-primary">보기</a>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- 빈 상태 -->
        <template x-if="!loading && (!boards || boards.length === 0)">
            <div class="text-center py-12">
                <p class="text-gray-600 text-lg mb-4">게시판이 없습니다.</p>
            </div>
        </template>
    </div>

    <script>
        function boardsList() {
            return {
                boards: [],
                loading: true,
                error: '',

                init() {
                    if (this.boards.length > 0 || this._initialized) return;
                    this._initialized = true;

                    fetch('/api/boards')
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('게시판을 불러올 수 없습니다.');
                            }
                            return response.json();
                        })
                        .then(data => {
                            console.log('API 응답:', data);
                            let boardList = [];

                            // data.data가 배열인 경우
                            if (Array.isArray(data.data)) {
                                boardList = data.data;
                            }
                            // data가 배열인 경우
                            else if (Array.isArray(data)) {
                                boardList = data;
                            }

                            console.log('최종 게시판 목록:', boardList);
                            this.boards = boardList;
                        })
                        .catch(err => {
                            this.error = err.message;
                            console.error('API 에러:', err);
                        })
                        .finally(() => {
                            this.loading = false;
                        });
                }
            }
        }
    </script>
</main>
</body>
</html>
