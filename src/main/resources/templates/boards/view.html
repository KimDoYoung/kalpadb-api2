<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>게시판 상세 - KalpaDB</title>
</head>
<body>
<main layout:fragment="content">
    <div x-data="boardDetail()" x-init="init()">
        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-600">로딩 중...</p>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <p x:text="error"></p>
        </div>

        <!-- 게시판 상세 -->
        <div x-show="!loading && board" class="space-y-6">
            <!-- 헤더 -->
            <div class="flex justify-between items-start border-b pb-4">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800" x-text="board.boardNameKor"></h2>
                    <p class="text-gray-600 mt-2" x-text="board.description || '(설명 없음)'"></p>
                    <p class="text-gray-500 text-sm mt-1">
                        <span x-text="'콘텐츠 타입: ' + board.contentType"></span>
                    </p>
                </div>
                <div class="flex gap-2">
                    <a :href="'/posts/new?boardId=' + board.id" class="btn-primary">새 게시글 작성</a>
                    <a th:href="@{/boards}" class="text-blue-500 hover:text-blue-600">← 목록으로</a>
                </div>
            </div>

            <!-- 검색 및 필터 -->
            <div class="bg-gray-50 p-4 rounded-lg">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" x-model="searchKeyword" placeholder="검색어 입력" class="input"
                           @keyup.enter="loadPosts(0)">
                    <input type="date" x-model="startDate" class="input">
                    <input type="date" x-model="endDate" class="input">
                </div>
                <button @click="loadPosts(0)" class="btn-primary mt-3 w-full">검색</button>
            </div>

            <!-- 게시글 목록 -->
            <div class="space-y-3">
                <!-- 로딩 중 -->
                <template x-if="postsLoading">
                    <p class="text-center text-gray-600">게시글 로딩 중...</p>
                </template>

                <!-- 게시글 목록 -->
                <template x-if="!postsLoading && posts.length > 0">
                    <template x-for="(post, idx) in posts" :key="idx">
                        <div class="card hover:shadow-lg transition">
                            <div class="flex items-start justify-between">
                                <a :href="'/posts/' + post.id" class="block flex-1">
                                    <h3 class="text-lg font-bold text-gray-800 hover:text-blue-600" x-text="post.title"></h3>
                                    <div class="flex gap-4 mt-2 text-sm text-gray-600">
                                        <span x-text="'작성자: ' + post.author"></span>
                                        <span x-text="'조회: ' + post.viewCount"></span>
                                        <span x-text="'작성일: ' + formatDate(post.baseYmd)"></span>
                                    </div>
                                </a>
                                <a :href="'/posts/' + post.id" class="btn-primary flex-shrink-0 ml-2">보기</a>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- 게시글 없음 -->
                <template x-if="!postsLoading && posts.length === 0">
                    <div class="text-center py-8">
                        <p class="text-gray-600">게시글이 없습니다.</p>
                    </div>
                </template>
            </div>

            <!-- 페이지네이션 -->
            <template x-if="totalPages > 1">
                <div class="flex justify-center gap-2 mt-6">
                    <button @click="loadPosts(0)" :disabled="currentPage === 0" class="px-3 py-2 border rounded hover:bg-gray-100">
                        처음
                    </button>
                    <button @click="loadPosts(currentPage - 1)" :disabled="currentPage === 0" class="px-3 py-2 border rounded hover:bg-gray-100">
                        이전
                    </button>

                    <template x-for="page in Array.from({length: totalPages}, (_, i) => i)" :key="page">
                        <button @click="loadPosts(page)"
                                :class="currentPage === page ? 'bg-blue-500 text-white' : 'border hover:bg-gray-100'"
                                class="px-3 py-2 rounded"
                                x-text="page + 1">
                        </button>
                    </template>

                    <button @click="loadPosts(currentPage + 1)" :disabled="currentPage === totalPages - 1" class="px-3 py-2 border rounded hover:bg-gray-100">
                        다음
                    </button>
                    <button @click="loadPosts(totalPages - 1)" :disabled="currentPage === totalPages - 1" class="px-3 py-2 border rounded hover:bg-gray-100">
                        마지막
                    </button>
                </div>
            </template>
        </div>
    </div>

    <script>
        function boardDetail() {
            const boardId = window.location.pathname.split('/').pop();

            return {
                boardId: boardId,
                board: null,
                posts: [],
                loading: true,
                postsLoading: false,
                error: '',
                searchKeyword: '',
                startDate: '',
                endDate: '',
                currentPage: 0,
                totalPages: 0,

                async init() {
                    try {
                        const response = await fetch(`/api/boards/${this.boardId}`);
                        if (!response.ok) {
                            throw new Error('게시판을 불러올 수 없습니다.');
                        }
                        const data = await response.json();
                        this.board = data.data || data;

                        // 게시글 로드
                        await this.loadPosts(0);
                    } catch (err) {
                        this.error = err.message;
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },

                async loadPosts(page = 0) {
                    this.postsLoading = true;
                    try {
                        const params = new URLSearchParams({
                            boardId: this.boardId,
                            page: page,
                            size: 10
                        });

                        if (this.searchKeyword) {
                            params.append('keyword', this.searchKeyword);
                        }
                        if (this.startDate) {
                            params.append('startYmd', this.formatDateToYmd(this.startDate));
                        }
                        if (this.endDate) {
                            params.append('endYmd', this.formatDateToYmd(this.endDate));
                        }

                        const response = await fetch(`/api/posts?${params}`);
                        if (!response.ok) {
                            throw new Error('게시글을 불러올 수 없습니다.');
                        }
                        const data = await response.json();
                        const pageData = data.data || data;

                        this.posts = pageData.content || pageData || [];
                        this.currentPage = pageData.number || 0;
                        this.totalPages = pageData.totalPages || 1;

                        console.log('게시글 로드 성공:', {
                            posts: this.posts.length,
                            currentPage: this.currentPage,
                            totalPages: this.totalPages
                        });
                    } catch (err) {
                        console.error('게시글 로드 실패:', err);
                    } finally {
                        this.postsLoading = false;
                    }
                },

                formatDate(ymd) {
                    if (!ymd || ymd.length !== 8) return ymd;
                    return `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
                },

                formatDateToYmd(dateStr) {
                    if (!dateStr) return '';
                    const date = new Date(dateStr);
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}${month}${day}`;
                }
            }
        }
    </script>
</main>
</body>
</html>
