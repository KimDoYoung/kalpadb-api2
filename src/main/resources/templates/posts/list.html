<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">

<head>
    <title>게시글 - KalpaDB</title>
</head>

<body>
    <main layout:fragment="content">
        <div x-data="postsList()" x-init="init()">
            <!-- 페이지 헤더 & 게시판 변경 -->
            <div class="flex flex-row items-center justify-between gap-4 mb-8">
                <div class="flex items-center gap-4">
                    <a href="/boards"
                        class="p-2 rounded-full hover:bg-base-200 text-base-content/40 hover:text-base-content transition-colors"
                        title="게시판 목록으로">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
                        </svg>
                    </a>

                    <div class="relative">
                        <h2 class="text-3xl font-bold text-base-content flex items-center gap-2 cursor-pointer group"
                            @click="toggleBoardDropdown()">
                            <span x-text="getCurrentBoardName() || '게시판 선택'"></span>
                            <svg class="w-6 h-6 text-base-content/40 group-hover:text-primary transition-colors" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                            </svg>
                        </h2>

                        <!-- Board List Dropdown -->
                        <div x-show="showBoardDropdown" @click.away="showBoardDropdown = false"
                            x-transition:enter="transition ease-out duration-100"
                            x-transition:enter-start="transform opacity-0 scale-95"
                            x-transition:enter-end="transform opacity-100 scale-100"
                            x-transition:leave="transition ease-in duration-75"
                            x-transition:leave-start="transform opacity-100 scale-100"
                            x-transition:leave-end="transform opacity-0 scale-95"
                            class="absolute left-0 mt-2 w-64 bg-base-100 rounded-xl shadow-2xl border border-base-300 z-50 py-2"
                            style="display: none;" x-cloak>
                            <div class="px-4 py-2 border-b border-base-200">
                                <span class="text-xs font-semibold text-base-content/40 uppercase tracking-wider">게시판 목록</span>
                            </div>
                            <div class="max-h-64 overflow-y-auto custom-scrollbar">
                                <template x-for="board in boards" :key="board.id">
                                    <a :href="'/posts?boardId=' + board.id"
                                        class="flex items-center justify-between px-4 py-3 hover:bg-primary/10 transition-colors group"
                                        :class="{'bg-primary/10': board.id === selectedBoardId}">
                                        <div>
                                            <div class="font-medium text-base-content group-hover:text-primary"
                                                x-text="board.boardNameKor"></div>
                                            <div class="text-xs text-base-content/60" x-text="board.boardCode"></div>
                                        </div>
                                        <span x-show="board.id === selectedBoardId" class="text-primary">
                                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
                                            </svg>
                                        </span>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button type="button" @click="goToCreate()"
                        class="btn btn-primary flex items-center gap-2 shadow-lg transition-all"
                        x-show="selectedBoardId">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"/>
                        </svg>
                        <span>새 글 쓰기</span>
                    </button>
                </div>
            </div>

            <!-- 로딩 상태 -->
            <div x-show="loading" class="text-center py-8">
                <div class="loading loading-spinner loading-lg text-primary"></div>
            </div>

            <!-- 에러 메시지 -->
            <div x-show="error"
                class="alert alert-error mb-6 flex justify-between items-center"
                x-cloak>
                <p x-text="error"></p>
                <button type="button" @click="error = ''" class="font-bold">&times;</button>
            </div>

            <!-- 게시글 목록 -->
            <template x-if="!loading && selectedBoardId && posts.length > 0">
                <div class="overflow-x-auto bg-base-100 rounded-xl shadow-sm border border-base-300">
                    <table class="min-w-full divide-y divide-base-200">
                        <thead class="bg-base-200">
                            <tr>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-base-content/60 uppercase tracking-wider w-16">
                                    No
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-base-content/60 uppercase tracking-wider">
                                    제목
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-medium text-base-content/60 uppercase tracking-wider w-32">
                                    작성자
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-medium text-base-content/60 uppercase tracking-wider w-24">
                                    조회수
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-medium text-base-content/60 uppercase tracking-wider w-32">
                                    작성일
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-medium text-base-content/60 uppercase tracking-wider w-20">
                                    삭제
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-base-100 divide-y divide-base-200">
                            <template x-for="(post, idx) in posts" :key="post.id || idx">
                                <tr class="hover:bg-primary/10 transition-colors cursor-pointer group"
                                    @click="goToView(post.id)">
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-base-content/60" x-text="totalElements - (currentPage * pageSize) - idx">
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-2">
                                            <span x-show="post.new"
                                                class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium badge badge-error">
                                                NEW
                                            </span>
                                            <span
                                                class="text-sm font-medium text-base-content group-hover:text-primary transition-colors line-clamp-1"
                                                x-text="post.title"></span>

                                            <!-- 첨부파일 아이콘 (Optional) -->
                                            <span x-show="post.attachmentCount > 0" class="text-base-content/40" title="첨부파일">
                                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13"/>
                                                </svg>
                                            </span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-center">
                                        <div class="text-sm text-base-content" x-text="post.author || '관리자'"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-base-content/60"
                                        x-text="post.viewCount">
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-base-content/60"
                                        x-text="formatDate(post.createdAt)">
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-center">
                                        <button type="button" @click.stop="deletePost(post.id)"
                                            class="text-error hover:text-error/80 text-sm font-medium">
                                            삭제
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- 페이지네이션 -->
            <template x-if="!loading && selectedBoardId && totalPages > 1">
                <div class="flex justify-center items-center gap-2 mt-8">
                    <button type="button" @click="previousPage()" :disabled="currentPage === 0"
                        class="px-4 py-2 btn btn-outline btn-sm">
                        이전
                    </button>
                    <template x-for="page in Array.from({length: totalPages}, (_, i) => i)">
                        <button type="button" @click="goToPage(page)"
                            :class="page === currentPage ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm'"
                            x-text="page + 1">
                        </button>
                    </template>
                    <button type="button" @click="nextPage()" :disabled="currentPage >= totalPages - 1"
                        class="px-4 py-2 btn btn-outline btn-sm">
                        다음
                    </button>
                </div>
            </template>

            <!-- 빈 상태 -->
            <template x-if="!loading && selectedBoardId && posts.length === 0">
                <div
                    class="flex flex-col items-center justify-center py-24 bg-base-100 rounded-3xl border border-dashed border-base-300 text-center">
                    <div
                        class="w-20 h-20 bg-primary/20 text-primary rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner">
                        📝
                    </div>
                    <h3 class="text-2xl font-bold text-base-content mb-3">게시글이 존재하지 않습니다</h3>
                    <p class="text-base-content/60 mb-8 max-w-md mx-auto leading-relaxed">
                        아직 작성된 글이 없습니다.<br>
                        여러분의 이야기로 이 게시판을 첫 번째로 채워보세요!
                    </p>
                    <button type="button" @click="goToCreate()"
                        class="btn btn-primary px-8 py-3 text-lg shadow-xl transition-all duration-300 flex items-center gap-2">
                        <span>✨</span> 첫 게시글 작성하기
                    </button>
                </div>
            </template>

            <!-- 선택하지 않은 상태 -->
            <template x-if="!selectedBoardId && !loading">
                <div class="text-center py-12 bg-base-200 rounded-lg">
                    <p class="text-base-content/60 text-lg">게시판을 선택해주세요.</p>
                </div>
            </template>
        </div>

        <script>
            function postsList() {
                return {
                    boards: [],
                    posts: [],
                    selectedBoardId: '',
                    loading: true,
                    error: '',
                    currentPage: 0,
                    pageSize: 10,
                    totalPages: 0,
                    totalElements: 0,
                    showBoardDropdown: false,

                    init() {
                        if (this._initialized) return;
                        this._initialized = true;

                        // URL 파라미터 확인
                        const urlParams = new URLSearchParams(window.location.search);
                        const boardIdParam = urlParams.get('boardId');

                        if (boardIdParam) {
                            this.selectedBoardId = parseInt(boardIdParam);
                            this.loadPosts();
                        }

                        this.loadBoards();
                    },

                    getCurrentBoardName() {
                        if (!this.selectedBoardId) return null;
                        if (this.boards.length === 0) return '로딩 중...';
                        const board = this.boards.find(b => b.id === this.selectedBoardId);
                        return board ? board.boardNameKor : '알 수 없는 게시판';
                    },

                    toggleBoardDropdown() {
                        this.showBoardDropdown = !this.showBoardDropdown;
                    },

                    loadBoards() {
                        fetch('/api/boards')
                            .then(res => {
                                if (!res.ok) throw new Error('게시판 로드 실패');
                                return res.json();
                            })
                            .then(data => {
                                this.boards = Array.isArray(data.data) ? data.data : [];
                            })
                            .catch(err => this.error = err.message);
                    },

                    loadPosts() {
                        this.loading = true;
                        this.error = '';

                        const url = new URL('/api/posts', window.location.origin);
                        url.searchParams.set('boardId', this.selectedBoardId);
                        url.searchParams.set('page', this.currentPage);
                        url.searchParams.set('size', this.pageSize);
                        url.searchParams.set('sort', 'createdAt,desc');

                        fetch(url)
                            .then(res => {
                                if (!res.ok) throw new Error('게시글 로드 실패');
                                return res.json();
                            })
                            .then(data => {
                                const pageData = data.data || {};
                                this.posts = Array.isArray(pageData.content) ? pageData.content : [];
                                this.totalPages = pageData.totalPages || 0;
                                this.totalElements = pageData.totalElements || 0;
                            })
                            .catch(err => this.error = err.message)
                            .finally(() => this.loading = false);
                    },

                    onBoardChange() {
                        // Dropdown 방식이므로 이 메서드는 더 이상 직접 호출되지 않을 수 있지만, 
                        // 혹시 모를 호환성을 위해 유지하거나 로직을 url 이동으로 변경
                        if (this.selectedBoardId) {
                            window.location.href = '/posts?boardId=' + this.selectedBoardId;
                        }
                    },

                    goToCreate() {
                        window.location.href = `/posts/new?boardId=${this.selectedBoardId}`;
                    },

                    goToView(postId) {
                        window.location.href = `/posts/${postId}`;
                    },

                    async deletePost(postId) {
                        if (!confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
                            return;
                        }

                        try {
                            const response = await fetch(`/api/posts/${postId}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });

                            if (!response.ok) {
                                const errorData = await response.json();
                                throw new Error(errorData.message || '삭제에 실패했습니다.');
                            }

                            alert('삭제되었습니다.');
                            this.loadPosts();
                        } catch (err) {
                            this.error = err.message;
                            alert(err.message);
                        }
                    },

                    previousPage() {
                        if (this.currentPage > 0) {
                            this.currentPage--;
                            this.loadPosts();
                            window.scrollTo(0, 0);
                        }
                    },

                    nextPage() {
                        if (this.currentPage < this.totalPages - 1) {
                            this.currentPage++;
                            this.loadPosts();
                            window.scrollTo(0, 0);
                        }
                    },

                    goToPage(page) {
                        this.currentPage = page;
                        this.loadPosts();
                        window.scrollTo(0, 0);
                    },

                    formatDate(dateString) {
                        if (!dateString) return '';
                        const date = new Date(dateString);
                        // 오늘 날짜면 시간만, 아니면 날짜 표시
                        const today = new Date();
                        const isToday = date.getDate() === today.getDate() &&
                            date.getMonth() === today.getMonth() &&
                            date.getFullYear() === today.getFullYear();

                        if (isToday) {
                            return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
                        }
                        return date.toLocaleDateString('ko-KR', {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit'
                        });
                    }
                }
            }
        </script>
    </main>
</body>

</html>
