<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">

<head>
    <title>게시글 - KalpaDB</title>
</head>

<body>
    <main layout:fragment="content">
        <div x-data="postsList()" x-init="init()">
            <!-- 페이지 헤더 & 게시판 변경 -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div class="flex items-center gap-4">
                    <a th:href="@{/boards}"
                        class="p-2 rounded-full hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors"
                        title="게시판 목록으로">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </a>

                    <div class="relative">
                        <h2 class="text-3xl font-bold text-gray-800 flex items-center gap-2 cursor-pointer group"
                            @click="toggleBoardDropdown()">
                            <span x-text="getCurrentBoardName() || '게시판 선택'"></span>
                            <svg class="w-6 h-6 text-gray-400 group-hover:text-blue-500 transition-colors" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </h2>

                        <!-- Board List Dropdown -->
                        <div x-show="showBoardDropdown" @click.away="showBoardDropdown = false"
                            x-transition:enter="transition ease-out duration-100"
                            x-transition:enter-start="transform opacity-0 scale-95"
                            x-transition:enter-end="transform opacity-100 scale-100"
                            x-transition:leave="transition ease-in duration-75"
                            x-transition:leave-start="transform opacity-100 scale-100"
                            x-transition:leave-end="transform opacity-0 scale-95"
                            class="absolute left-0 mt-2 w-64 bg-white rounded-xl shadow-2xl border border-gray-100 z-50 py-2"
                            style="display: none;" x-cloak>
                            <div class="px-4 py-2 border-b border-gray-50">
                                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">게시판 목록</span>
                            </div>
                            <div class="max-h-64 overflow-y-auto custom-scrollbar">
                                <template x-for="board in boards" :key="board.id">
                                    <a :href="APP_CTX + '/posts?boardId=' + board.id"
                                        class="flex items-center justify-between px-4 py-3 hover:bg-blue-50 transition-colors group"
                                        :class="{'bg-blue-50/50': board.id === selectedBoardId}">
                                        <div>
                                            <div class="font-medium text-gray-800 group-hover:text-blue-700"
                                                x-text="board.boardNameKor"></div>
                                            <div class="text-xs text-gray-500" x-text="board.boardCode"></div>
                                        </div>
                                        <span x-show="board.id === selectedBoardId" class="text-blue-600">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M5 13l4 4L19 7"></path>
                                            </svg>
                                        </span>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button @click="goToCreate()"
                        class="btn-primary flex items-center gap-2 shadow-lg shadow-blue-200 hover:shadow-blue-300 transition-all"
                        x-show="selectedBoardId">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
                            </path>
                        </svg>
                        <span>새 글 쓰기</span>
                    </button>
                </div>
            </div>

            <!-- 로딩 상태 -->
            <div x-show="loading" class="text-center py-8">
                <p class="text-gray-600">로딩 중...</p>
            </div>

            <!-- 에러 메시지 -->
            <div x-show="error"
                class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6 flex justify-between items-center"
                x-cloak>
                <p x-text="error"></p>
                <button @click="error = ''" class="text-red-700 font-bold">&times;</button>
            </div>

            <!-- 게시글 목록 -->
            <template x-if="!loading && selectedBoardId && posts.length > 0">
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-gray-100">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">
                                    No
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    제목
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-32">
                                    작성자
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-24">
                                    조회수
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-32">
                                    작성일
                                </th>
                                <th scope="col"
                                    class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20">
                                    삭제
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <template x-for="(post, idx) in posts" :key="post.id || idx">
                                <tr class="hover:bg-blue-50/50 transition-colors cursor-pointer group"
                                    @click="goToView(post.id)">
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="totalElements - (currentPage * pageSize) - idx">
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-2">
                                            <span x-show="post.new"
                                                class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800">
                                                NEW
                                            </span>
                                            <span
                                                class="text-sm font-medium text-gray-900 group-hover:text-blue-600 transition-colors line-clamp-1"
                                                x-text="post.title"></span>

                                            <!-- 첨부파일 아이콘 (Optional) -->
                                            <span x-show="post.attachmentCount > 0" class="text-gray-400" title="첨부파일">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor"
                                                    viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2"
                                                        d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13">
                                                    </path>
                                                </svg>
                                            </span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-center">
                                        <div class="text-sm text-gray-900" x-text="post.author || '관리자'"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500"
                                        x-text="post.viewCount">
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500"
                                        x-text="formatDate(post.createdAt)">
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-center">
                                        <button @click.stop="deletePost(post.id)"
                                            class="text-red-500 hover:text-red-700 text-sm font-medium">
                                            삭제
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- 페이지네이션 -->
            <template x-if="!loading && selectedBoardId && totalPages > 1">
                <div class="flex justify-center items-center gap-2 mt-8">
                    <button @click="previousPage()" :disabled="currentPage === 0"
                        class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50">
                        이전
                    </button>
                    <template x-for="page in Array.from({length: totalPages}, (_, i) => i)">
                        <button @click="goToPage(page)"
                            :class="page === currentPage ? 'bg-blue-600 text-white' : 'border border-gray-300 hover:bg-gray-50'"
                            class="px-3 py-2 rounded" x-text="page + 1">
                        </button>
                    </template>
                    <button @click="nextPage()" :disabled="currentPage >= totalPages - 1"
                        class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50">
                        다음
                    </button>
                </div>
            </template>

            <!-- 빈 상태 -->
            <template x-if="!loading && selectedBoardId && posts.length === 0">
                <div
                    class="flex flex-col items-center justify-center py-24 bg-white rounded-3xl border border-dashed border-gray-200 text-center">
                    <div
                        class="w-20 h-20 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner">
                        📝
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800 mb-3">게시글이 존재하지 않습니다</h3>
                    <p class="text-gray-500 mb-8 max-w-md mx-auto leading-relaxed">
                        아직 작성된 글이 없습니다.<br>
                        여러분의 이야기로 이 게시판을 첫 번째로 채워보세요!
                    </p>
                    <button @click="goToCreate()"
                        class="btn-primary px-8 py-3 text-lg shadow-xl shadow-blue-100 hover:shadow-blue-200 hover:-translate-y-1 transition-all duration-300 flex items-center gap-2">
                        <span>✨</span> 첫 게시글 작성하기
                    </button>
                </div>
            </template>

            <!-- 선택하지 않은 상태 -->
            <template x-if="!selectedBoardId && !loading">
                <div class="text-center py-12 bg-gray-50 rounded-lg">
                    <p class="text-gray-600 text-lg">게시판을 선택해주세요.</p>
                </div>
            </template>
        </div>

        <script>
            function postsList() {
                return {
                    boards: [],
                    posts: [],
                    selectedBoardId: '',
                    loading: true,
                    error: '',
                    currentPage: 0,
                    pageSize: 10,
                    totalPages: 0,
                    totalElements: 0,
                    showBoardDropdown: false,

                    init() {
                        if (this._initialized) return;
                        this._initialized = true;

                        // URL 파라미터 확인
                        const urlParams = new URLSearchParams(window.location.search);
                        const boardIdParam = urlParams.get('boardId');

                        if (boardIdParam) {
                            this.selectedBoardId = parseInt(boardIdParam);
                            this.loadPosts();
                        }

                        this.loadBoards();
                    },

                    getCurrentBoardName() {
                        if (!this.selectedBoardId) return null;
                        if (this.boards.length === 0) return '로딩 중...';
                        const board = this.boards.find(b => b.id === this.selectedBoardId);
                        return board ? board.boardNameKor : '알 수 없는 게시판';
                    },

                    toggleBoardDropdown() {
                        this.showBoardDropdown = !this.showBoardDropdown;
                    },

                    loadBoards() {
                        fetch(APP_CTX + '/api/boards')
                            .then(res => {
                                if (!res.ok) throw new Error('게시판 로드 실패');
                                return res.json();
                            })
                            .then(data => {
                                this.boards = Array.isArray(data.data) ? data.data : [];
                            })
                            .catch(err => this.error = err.message);
                    },

                    loadPosts() {
                        this.loading = true;
                        this.error = '';

                        const url = new URL('/api/posts', window.location.origin);
                        url.searchParams.set('boardId', this.selectedBoardId);
                        url.searchParams.set('page', this.currentPage);
                        url.searchParams.set('size', this.pageSize);
                        url.searchParams.set('sort', 'createdAt,desc');

                        fetch(url)
                            .then(res => {
                                if (!res.ok) throw new Error('게시글 로드 실패');
                                return res.json();
                            })
                            .then(data => {
                                const pageData = data.data || {};
                                this.posts = Array.isArray(pageData.content) ? pageData.content : [];
                                this.totalPages = pageData.totalPages || 0;
                                this.totalElements = pageData.totalElements || 0;
                            })
                            .catch(err => this.error = err.message)
                            .finally(() => this.loading = false);
                    },

                    onBoardChange() {
                        // Dropdown 방식이므로 이 메서드는 더 이상 직접 호출되지 않을 수 있지만, 
                        // 혹시 모를 호환성을 위해 유지하거나 로직을 url 이동으로 변경
                        if (this.selectedBoardId) {
                            window.location.href = APP_CTX + '/posts?boardId=' + this.selectedBoardId;
                        }
                    },

                    goToCreate() {
                        window.location.href = `/posts/new?boardId=${this.selectedBoardId}`;
                    },

                    goToView(postId) {
                        window.location.href = `${APP_CTX}/posts/${postId}`;
                    },

                    async deletePost(postId) {
                        if (!confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
                            return;
                        }

                        try {
                            const response = await fetch(`${APP_CTX}/api/posts/${postId}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });

                            if (!response.ok) {
                                const errorData = await response.json();
                                throw new Error(errorData.message || '삭제에 실패했습니다.');
                            }

                            alert('삭제되었습니다.');
                            this.loadPosts();
                        } catch (err) {
                            this.error = err.message;
                            alert(err.message);
                        }
                    },

                    previousPage() {
                        if (this.currentPage > 0) {
                            this.currentPage--;
                            this.loadPosts();
                            window.scrollTo(0, 0);
                        }
                    },

                    nextPage() {
                        if (this.currentPage < this.totalPages - 1) {
                            this.currentPage++;
                            this.loadPosts();
                            window.scrollTo(0, 0);
                        }
                    },

                    goToPage(page) {
                        this.currentPage = page;
                        this.loadPosts();
                        window.scrollTo(0, 0);
                    },

                    formatDate(dateString) {
                        if (!dateString) return '';
                        const date = new Date(dateString);
                        // 오늘 날짜면 시간만, 아니면 날짜 표시
                        const today = new Date();
                        const isToday = date.getDate() === today.getDate() &&
                            date.getMonth() === today.getMonth() &&
                            date.getFullYear() === today.getFullYear();

                        if (isToday) {
                            return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
                        }
                        return date.toLocaleDateString('ko-KR', {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit'
                        });
                    }
                }
            }
        </script>
    </main>
</body>

</html>
