<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">

<head>
    <title>게시글 수정 - KalpaDB</title>
    <!-- 에디터 CSS (contentType에 따라 동적으로 로드) -->
    <link id="editor-css" rel="stylesheet">
</head>

<body>
    <main layout:fragment="content">
        <div x-data="postEdit()" x-init="init()">
            <!-- 로딩 상태 -->
            <div x-show="loading" class="text-center py-8">
                <div class="loading loading-spinner loading-lg text-primary"></div>
            </div>

            <!-- 에러 메시지 -->
            <div x-show="error" class="alert alert-error mb-6">
                <p x-text="error"></p>
            </div>

            <!-- 폼 -->
            <div x-show="!loading" class="space-y-6">
                <input type="hidden" id="postId" :value="postId">
                <!-- 페이지 헤더 -->
                <h2 class="text-3xl font-bold text-base-content">📝 게시글 수정</h2>

                <!-- 제목 -->
                <div>
                    <label for="title" class="label">
                        <span class="label-text text-base-content">제목 <span class="text-error">*</span></span>
                    </label>
                    <input type="text" id="title" x-model="form.title"
                        class="input input-bordered w-full focus:input-primary"
                        placeholder="게시글 제목" maxlength="500" required>
                </div>

                <!-- 작성자 + 기준일 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="author" class="label">
                            <span class="label-text text-base-content">작성자</span>
                        </label>
                        <input type="text" id="author" x-model="form.author"
                            class="input input-bordered w-full focus:input-primary"
                            placeholder="작성자명">
                    </div>
                    <div>
                        <label for="baseYmd" class="label">
                            <span class="label-text text-base-content">기준일</span>
                        </label>
                        <input type="date" id="baseYmd" x-model="form.baseYmd"
                            class="input input-bordered w-full focus:input-primary">
                    </div>
                </div>

                <!-- 내용 (contentType에 따라 다른 에디터 표시) -->
                <div>
                    <label class="label">
                        <span class="label-text text-base-content">내용 <span class="text-error">*</span></span>
                    </label>

                    <!-- HTML 에디터 (QuillJS) -->
                    <div x-show="contentType === 'html'">
                        <div id="quill-editor" class="bg-base-100 border border-base-300 rounded-lg w-full"></div>
                    </div>

                    <!-- Markdown 에디터 (TUI Editor) -->
                    <div x-show="contentType === 'markdown'">
                        <div id="tui-editor" class="bg-base-100 border border-base-300 rounded-lg w-full"></div>
                    </div>

                    <!-- Plain Text 에디터 -->
                    <div x-show="contentType === 'text'">
                        <textarea id="text-editor" x-model="form.content"
                            class="textarea textarea-bordered w-full focus:textarea-primary"
                            placeholder="내용을 입력하세요"
                            style="min-height: 350px; max-height: 400px; resize: vertical;"></textarea>
                    </div>

                    <input type="hidden" id="content" x-model="form.content">
                </div>

                <!-- 첨부파일 -->
                <div class="border-t pt-6">
                    <h3 class="text-lg font-bold text-base-content mb-4">📎 첨부파일</h3>

                    <!-- 기존 파일 목록 -->
                    <div x-show="existingFiles.length > 0" class="mb-6">
                        <h4 class="text-sm font-medium text-base-content mb-3">기존 파일</h4>
                        <div class="space-y-2">
                            <template x-for="file in existingFiles" :key="file.fileId">
                                <div
                                    class="flex items-center justify-between bg-base-200 p-3 rounded border border-base-300">
                                    <div class="flex-1">
                                        <p class="text-sm text-base-content" x-text="file.orgFileName"></p>
                                        <p class="text-xs text-base-content/60"
                                            x-text="'(' + formatFileSize(file.fileSize) + ')'"></p>
                                    </div>
                                    <button type="button" @click="removeExistingFile(file.fileId)"
                                        class="text-error hover:text-error/80 text-sm font-medium">
                                        삭제
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 새 파일 업로드 -->
                    <div class="mb-4">
                        <label for="file-input" class="label">
                            <span class="label-text text-base-content">새 파일 추가</span>
                        </label>
                        <div class="flex items-center gap-2">
                            <input type="file" id="file-input" @change="addNewFiles($event)" multiple
                                class="input input-bordered w-full flex-1 focus:input-primary">
                        </div>
                        <p class="text-xs text-base-content/60 mt-1">여러 파일을 선택할 수 있습니다</p>
                    </div>

                    <!-- 추가된 파일 목록 -->
                    <div x-show="newFiles.length > 0" class="space-y-2">
                        <h4 class="text-sm font-medium text-base-content">추가된 파일</h4>
                        <template x-for="(file, index) in newFiles" :key="index">
                            <div
                                class="flex items-center justify-between bg-info/10 p-3 rounded border border-info/30">
                                <div class="flex-1">
                                    <p class="text-sm text-base-content" x-text="file.name"></p>
                                    <p class="text-xs text-base-content/60" x-text="'(' + formatFileSize(file.size) + ')'"></p>
                                </div>
                                <button type="button" @click="removeNewFile(index)"
                                    class="text-error hover:text-error/80 text-sm font-medium">
                                    삭제
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="flex gap-3">
                    <button type="button" @click="save()" :disabled="saving"
                        class="inline-flex items-center gap-2 btn btn-primary">
                        <span>💾</span> <span x-text="saving ? '저장 중...' : '저장'"></span>
                    </button>
                    <button type="button" @click="deletePost()" :disabled="saving"
                        class="inline-flex items-center gap-2 btn btn-error">
                        <span>🗑️</span> 삭제
                    </button>
                    <button type="button" @click="goBack()" :disabled="saving"
                        class="inline-flex items-center gap-2 btn btn-secondary">
                        <span>📋</span> 목록으로
                    </button>
                </div>

            </div>
        </div>

        <!-- 에디터 JS (contentType에 따라 동적으로 로드) -->
        <script id="editor-js"></script>

        <style>
            /* QuillJS 스타일 */
            #quill-editor {
                border: 1px solid #d1d5db !important;
                border-radius: 0.5rem !important;
            }

            .ql-toolbar.ql-snow {
                border-top-left-radius: 0.5rem !important;
                border-top-right-radius: 0.5rem !important;
                background-color: #f9fafb !important;
                border: 1px solid #d1d5db !important;
                border-bottom: 1px solid #d1d5db !important;
            }

            .ql-toolbar.ql-snow button:hover,
            .ql-toolbar.ql-snow button.ql-active {
                color: #06b6d4 !important;
            }

            .ql-toolbar.ql-snow button.ql-active .ql-stroke {
                stroke: #06b6d4 !important;
            }

            .ql-toolbar.ql-snow button.ql-active .ql-fill {
                fill: #06b6d4 !important;
            }

            .ql-container.ql-snow {
                border-bottom-left-radius: 0.5rem !important;
                border-bottom-right-radius: 0.5rem !important;
                border: none !important;
                font-size: 14px !important;
            }

            .ql-editor {
                padding: 12px !important;
                min-height: 350px !important;
                max-height: 400px !important;
                overflow-y: auto !important;
            }

            .ql-editor.ql-blank::before {
                color: #9ca3af !important;
            }

            /* TUI Editor 스타일 */
            #tui-editor {
                border: 1px solid #d1d5db !important;
                border-radius: 0.5rem !important;
            }

            .toastui-editor-defaultUI {
                border-radius: 0.5rem !important;
            }

            .toastui-editor-toolbar {
                background-color: #f9fafb !important;
                border-bottom: 1px solid #d1d5db !important;
            }

            .toastui-editor {
                font-size: 14px !important;
            }

            /* Text Editor 스타일 */
            #text-editor {
                font-family: 'Courier New', monospace;
                font-size: 14px;
            }
        </style>
        <script>
            let quillEditor;
            let tuiEditor;
            let loadedEditorType = null;

            function postEdit() {
                const postId = window.location.pathname.split('/')[2];

                return {
                    postId: postId,
                    boardId: null,
                    contentType: '', // html, markdown, text
                    form: {
                        title: '',
                        author: '',
                        baseYmd: '',
                        content: ''
                    },
                    existingFiles: [],
                    newFiles: [],
                    deletedFileIds: [],
                    loading: true,
                    saving: false,
                    error: '',

                    async init() {
                        try {
                            const response = await fetch(`/api/posts/${this.postId}`);
                            if (!response.ok) {
                                throw new Error('게시글을 불러올 수 없습니다.');
                            }
                            const data = await response.json();
                            const post = data.data || data;

                            // baseYmd를 YYYY-MM-DD로 변환
                            const baseYmdFormatted = post.baseYmd ?
                                `${post.baseYmd.substring(0, 4)}-${post.baseYmd.substring(4, 6)}-${post.baseYmd.substring(6, 8)}` :
                                '';

                            this.boardId = post.boardId;
                            this.form = {
                                title: post.title || '',
                                author: post.author || '',
                                baseYmd: baseYmdFormatted,
                                content: post.content || ''
                            };

                            // board 정보로부터 contentType 결정
                            await this.loadBoardInfo();
                            await this.loadEditorResources();
                            await this.initEditor();

                            // 에디터에 내용 설정
                            this.setEditorContent();

                            // 첨부파일 로드
                            await this.loadAttachedFiles();
                        } catch (err) {
                            this.error = err.message;
                            console.error('초기화 오류:', err);
                        } finally {
                            this.loading = false;
                        }
                    },

                    async loadBoardInfo() {
                        try {
                            const response = await fetch(`/api/boards/${this.boardId}`);
                            if (response.ok) {
                                const data = await response.json();
                                const board = data.data || data;
                                this.contentType = board.contentType || 'html';
                            }
                        } catch (err) {
                            console.error('게시판 정보 로드 실패:', err);
                            this.contentType = 'html'; // 기본값
                        }
                    },

                    async loadEditorResources() {
                        if (loadedEditorType === this.contentType) {
                            return;
                        }

                        this.cleanupEditor();

                        switch (this.contentType) {
                            case 'markdown':
                                await this.loadTuiEditorResources();
                                break;
                            case 'html':
                            case 'text':
                            default:
                                await this.loadQuillResources();
                                break;
                        }

                        loadedEditorType = this.contentType;
                    },

                    loadQuillResources() {
                        return new Promise((resolve) => {
                            const cssLink = document.getElementById('editor-css');
                            cssLink.href = 'https://cdn.quilljs.com/1.3.6/quill.snow.css';

                            if (window.Quill) {
                                resolve();
                                return;
                            }

                            const script = document.createElement('script');
                            script.src = 'https://cdn.quilljs.com/1.3.6/quill.js';
                            script.onload = resolve;
                            document.head.appendChild(script);
                        });
                    },

                    async loadTuiEditorResources() {
                        return new Promise((resolve) => {
                            if (!document.querySelector('link[href*="tui.editor"]')) {
                                const link1 = document.createElement('link');
                                link1.rel = 'stylesheet';
                                link1.href = 'https://uicdn.toast.com/editor/latest/toastui-editor.min.css';
                                document.head.appendChild(link1);

                                const link2 = document.createElement('link');
                                link2.rel = 'stylesheet';
                                link2.href = 'https://uicdn.toast.com/editor/latest/toastui-editor-dark.min.css';
                                document.head.appendChild(link2);
                            }

                            if (window.toastui && window.toastui.Editor) {
                                resolve();
                                return;
                            }

                            const script1 = document.createElement('script');
                            script1.src = 'https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js';
                            script1.onload = resolve;
                            document.head.appendChild(script1);
                        });
                    },

                    cleanupEditor() {
                        if (quillEditor) {
                            quillEditor = null;
                        }

                        if (tuiEditor) {
                            tuiEditor.destroy();
                            tuiEditor = null;
                        }

                        const quillContainer = document.getElementById('quill-editor');
                        const tuiContainer = document.getElementById('tui-editor');
                        if (quillContainer) quillContainer.innerHTML = '';
                        if (tuiContainer) tuiContainer.innerHTML = '';
                    },

                    async initEditor() {
                        switch (this.contentType) {
                            case 'markdown':
                                this.initTuiEditor();
                                break;
                            case 'html':
                                this.initQuillEditor();
                                break;
                            case 'text':
                                break;
                        }
                    },

                    initQuillEditor() {
                        if (quillEditor) return;

                        quillEditor = new Quill('#quill-editor', {
                            theme: 'snow',
                            placeholder: '게시글 내용을 입력하세요',
                            modules: {
                                toolbar: [
                                    'bold', 'italic', 'underline', 'strike',
                                    { 'list': 'ordered' }, { 'list': 'bullet' },
                                    { 'header': [2, 3, false] },
                                    { 'color': [] },
                                    { 'align': [] },
                                    'link', 'image',
                                    'clean'
                                ]
                            }
                        });

                        quillEditor.on('text-change', () => {
                            this.form.content = quillEditor.root.innerHTML;
                            document.getElementById('content').value = this.form.content;
                        });
                    },

                    initTuiEditor() {
                        if (tuiEditor) return;

                        tuiEditor = new toastui.Editor({
                            el: document.getElementById('tui-editor'),
                            height: '350px',
                            initialEditType: 'markdown',
                            previewStyle: 'tab',
                            placeholder: '게시글 내용을 입력하세요',
                            toolbarItems: [
                                ['heading', 'bold', 'italic'],
                                ['hr', 'quote'],
                                ['ul', 'ol', 'task', 'indent', 'outdent'],
                                ['table', 'image', 'link'],
                                ['code', 'codeblock'],
                                ['scrollSync']
                            ]
                        });

                        tuiEditor.on('change', () => {
                            this.form.content = tuiEditor.getMarkdown();
                            document.getElementById('content').value = this.form.content;
                        });
                    },

                    setEditorContent() {
                        if (this.contentType === 'html' && quillEditor) {
                            quillEditor.root.innerHTML = this.form.content;
                        } else if (this.contentType === 'markdown' && tuiEditor) {
                            tuiEditor.setMarkdown(this.form.content);
                        }
                        document.getElementById('content').value = this.form.content;
                    },

                    async loadAttachedFiles() {
                        try {
                            const response = await fetch(`/api/posts/${this.postId}/files`);
                            if (response.ok) {
                                const data = await response.json();
                                this.existingFiles = data.data || [];
                            }
                        } catch (err) {
                            console.error('파일 로드 실패:', err);
                        }
                    },

                    addNewFiles(event) {
                        const files = event.target.files;
                        for (let file of files) {
                            this.newFiles.push(file);
                        }
                        // 파일 선택 초기화
                        event.target.value = '';
                    },

                    removeNewFile(index) {
                        this.newFiles.splice(index, 1);
                    },

                    removeExistingFile(fileId) {
                        const index = this.existingFiles.findIndex(f => f.fileId === fileId);
                        if (index > -1) {
                            this.existingFiles.splice(index, 1);
                            if (!this.deletedFileIds.includes(fileId)) {
                                this.deletedFileIds.push(fileId);
                            }
                        }
                    },

                    formatFileSize(bytes) {
                        if (bytes === 0) return '0 Bytes';
                        const k = 1024;
                        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                        const i = Math.floor(Math.log(bytes) / Math.log(k));
                        return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
                    },

                    goBack() {
                        if (this.boardId) {
                            window.location.href = `/posts?boardId=${this.boardId}`;
                        } else {
                            window.history.back();
                        }
                    },

                    async deletePost() {
                        if (!confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
                            return;
                        }

                        this.saving = true;
                        try {
                            const response = await fetch(`/api/posts/${this.postId}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });

                            if (!response.ok) {
                                const errorData = await response.json();
                                throw new Error(errorData.message || '삭제에 실패했습니다.');
                            }

                            alert('삭제되었습니다.');
                            window.history.back();
                        } catch (err) {
                            this.error = err.message;
                            alert(err.message);
                            console.error(err);
                        } finally {
                            this.saving = false;
                        }
                    },

                    async save() {
                        if (!this.form.title.trim()) {
                            alert('제목을 입력하세요.');
                            return;
                        }

                        // contentType에 따른 content 검증
                        const isEmptyContent = this.contentType === 'html'
                            ? (!this.form.content || this.form.content === '<p><br></p>')
                            : !this.form.content || !this.form.content.trim();

                        if (isEmptyContent) {
                            alert('내용을 입력하세요.');
                            return;
                        }

                        this.saving = true;
                        try {
                            const formData = new FormData();
                            if (this.form.title.trim()) {
                                formData.append('title', this.form.title);
                            }
                            if (this.form.author.trim()) {
                                formData.append('author', this.form.author);
                            }
                            if (this.form.baseYmd) {
                                // baseYmd를 YYYYMMDD 형식으로 변환
                                const baseYmdFormatted = this.form.baseYmd.replace(/-/g, '');
                                formData.append('baseYmd', baseYmdFormatted);
                            }
                            if (this.form.content) {
                                formData.append('content', this.form.content);
                            }

                            // 새 파일 추가
                            for (let file of this.newFiles) {
                                formData.append('newFiles', file);
                            }

                            // 삭제할 파일 ID 목록 추가
                            if (this.deletedFileIds.length > 0) {
                                formData.append('deletedFileIds', JSON.stringify(this.deletedFileIds));
                            }

                            const response = await fetch(`/api/posts/${this.postId}`, {
                                method: 'PUT',
                                body: formData,
                                credentials: 'include'
                            });

                            if (!response.ok) {
                                const errorData = await response.json();
                                throw new Error(errorData.message || '저장에 실패했습니다.');
                            }

                            alert('수정되었습니다.');
                            window.location.href = `/posts/${this.postId}`;
                        } catch (err) {
                            this.error = err.message;
                            alert(err.message);
                            console.error(err);
                        } finally {
                            this.saving = false;
                        }
                    }
                }
            }
        </script>
    </main>
</body>

</html>
