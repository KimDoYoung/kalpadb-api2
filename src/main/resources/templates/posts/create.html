<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">

<head>
    <title>게시글 작성 - KalpaDB</title>
    <!-- 에디터 CSS (contentType에 따라 동적으로 로드) -->
    <link id="editor-css" rel="stylesheet">
</head>

<body>
    <main layout:fragment="content">
        <div x-data="postCreate()" x-init="init()">
            <!-- 에러 메시지 -->
            <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
                <p x-text="error"></p>
            </div>

            <!-- 폼 -->
            <div class="space-y-6">
                <!-- 페이지 헤더 -->
                <h2 class="text-3xl font-bold text-gray-800">✏️ <span class="font-bold text-gray-800" x-text="getBoardName()"></span>새 게시글 작성</h2>

                <!-- 게시판 선택 -->
                <div>
                    <div><input type="hidden" :value="form.boardId"></div>
                    <!-- 게시판 선택 (직접 선택해야 하는 경우) -->
                    <div x-show="!isFixedBoard">
                        <label for="boardId" class="block text-sm font-medium text-gray-700 mb-2">
                            게시판 <span class="text-red-600">*</span>
                        </label>
                        <select id="boardId" x-model="form.boardId"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            :required="!isFixedBoard">
                            <option value="">-- 게시판을 선택하세요 --</option>
                            <template x-for="board in boards" :key="board.id">
                                <option :value="board.id" x-text="board.boardNameKor"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- 제목 -->
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                        제목 <span class="text-red-600">*</span>
                    </label>
                    <input type="text" id="title" x-model="form.title"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="게시글 제목" maxlength="500" required>
                </div>

                <!-- 작성자 + 기준일 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="author" class="block text-sm font-medium text-gray-700 mb-2">
                            작성자 (선택사항)
                        </label>
                        <input type="text" id="author" x-model="form.author"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="작성자명 (미지정시 로그인 사용자)">
                    </div>
                    <div>
                        <label for="baseYmd" class="block text-sm font-medium text-gray-700 mb-2">
                            기준일 <span class="text-red-600">*</span>
                        </label>
                        <input type="date" id="baseYmd" x-model="form.baseYmd"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required>
                    </div>
                </div>

                <!-- 내용 (contentType에 따라 다른 에디터 표시) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        내용 <span class="text-red-600">*</span>
                    </label>

                    <!-- HTML 에디터 (QuillJS) -->
                    <div x-show="contentType === 'html'">
                        <div id="quill-editor" class="bg-white border border-gray-300 rounded-lg w-full"></div>
                    </div>

                    <!-- Markdown 에디터 (TUI Editor) -->
                    <div x-show="contentType === 'markdown'">
                        <div id="tui-editor" class="bg-white border border-gray-300 rounded-lg w-full"></div>
                    </div>

                    <!-- Plain Text 에디터 -->
                    <div x-show="contentType === 'text'">
                        <textarea id="text-editor" x-model="form.content"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="내용을 입력하세요"
                            style="min-height: 350px; max-height: 400px; resize: vertical;"></textarea>
                    </div>

                    <input type="hidden" id="content" x-model="form.content">
                </div>

                <!-- 첨부파일 -->
                <div class="border-t pt-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">📎 첨부파일 (선택사항)</h3>

                    <!-- 새 파일 업로드 -->
                    <div class="mb-4">
                        <label for="file-input" class="block text-sm font-medium text-gray-700 mb-2">
                            파일 추가
                        </label>
                        <div class="flex items-center gap-2">
                            <input type="file" id="file-input" @change="addNewFiles($event)" multiple
                                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <p class="text-xs text-gray-500 mt-1">여러 파일을 선택할 수 있습니다</p>
                    </div>

                    <!-- 추가된 파일 목록 -->
                    <div x-show="newFiles.length > 0" class="space-y-2">
                        <h4 class="text-sm font-medium text-gray-700">추가된 파일</h4>
                        <template x-for="(file, index) in newFiles" :key="index">
                            <div
                                class="flex items-center justify-between bg-blue-50 p-3 rounded border border-blue-200">
                                <div class="flex-1">
                                    <p class="text-sm text-gray-700" x-text="file.name"></p>
                                    <p class="text-xs text-gray-500" x-text="'(' + formatFileSize(file.size) + ')'"></p>
                                </div>
                                <button type="button" @click="removeNewFile(index)"
                                    class="text-red-500 hover:text-red-700 text-sm font-medium">
                                    삭제
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="flex gap-3">
                    <button type="button" @click="save()" :disabled="saving"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition shadow-sm disabled:opacity-50">
                        <span>💾</span> <span x-text="saving ? '저장 중...' : '저장'"></span>
                    </button>
                    <button type="button" @click="goBack()" :disabled="saving"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 hover:text-gray-600 transition shadow-sm disabled:opacity-50">
                        <span>↩️</span> 취소
                    </button>
                </div>
            </div>
        </div>

        <!-- 에디터 JS (contentType에 따라 동적으로 로드) -->
        <script id="editor-js"></script>

        <style>
            /* QuillJS 스타일 */
            #quill-editor {
                border: 1px solid #d1d5db !important;
                border-radius: 0.5rem !important;
            }

            .ql-toolbar.ql-snow {
                border-top-left-radius: 0.5rem !important;
                border-top-right-radius: 0.5rem !important;
                background-color: #f9fafb !important;
                border: 1px solid #d1d5db !important;
                border-bottom: 1px solid #d1d5db !important;
            }

            .ql-toolbar.ql-snow button:hover,
            .ql-toolbar.ql-snow button.ql-active {
                color: #06b6d4 !important;
            }

            .ql-toolbar.ql-snow button.ql-active .ql-stroke {
                stroke: #06b6d4 !important;
            }

            .ql-toolbar.ql-snow button.ql-active .ql-fill {
                fill: #06b6d4 !important;
            }

            .ql-container.ql-snow {
                border-bottom-left-radius: 0.5rem !important;
                border-bottom-right-radius: 0.5rem !important;
                border: none !important;
                font-size: 14px !important;
            }

            .ql-editor {
                padding: 12px !important;
                min-height: 350px !important;
                max-height: 400px !important;
                overflow-y: auto !important;
            }

            .ql-editor.ql-blank::before {
                color: #9ca3af !important;
            }

            /* TUI Editor 스타일 */
            #tui-editor {
                border: 1px solid #d1d5db !important;
                border-radius: 0.5rem !important;
            }

            .toastui-editor-defaultUI {
                border-radius: 0.5rem !important;
            }

            .toastui-editor-toolbar {
                background-color: #f9fafb !important;
                border-bottom: 1px solid #d1d5db !important;
            }

            .toastui-editor {
                font-size: 14px !important;
            }

            /* Text Editor 스타일 */
            #text-editor {
                font-family: 'Courier New', monospace;
                font-size: 14px;
            }
        </style>
        <script>
            let quillEditor;
            let tuiEditor;
            let loadedEditorType = null;

            function postCreate() {
                const urlParams = new URLSearchParams(window.location.search);
                const boardIdParam = urlParams.get('boardId');

                return {
                    isFixedBoard: !!boardIdParam,
                    boards: [],
                    contentType: '', // html, markdown, text
                    form: {
                        boardId: boardIdParam ? parseInt(boardIdParam) : '',
                        title: '',
                        author: '',
                        baseYmd: new Date().toISOString().split('T')[0], // YYYY-MM-DD 형식
                        content: ''
                    },
                    newFiles: [],
                    saving: false,
                    error: '',

                    async init() {
                        await this.loadBoards();

                        // 초기 boardId가 있으면 contentType 결정
                        if (this.form.boardId) {
                            this.determineContentType();
                            await this.loadEditorResources();
                            await this.initEditor();
                        }

                        // boardId 변경 감지
                        this.$watch('form.boardId', async (newVal) => {
                            if (newVal) {
                                this.determineContentType();
                                await this.loadEditorResources();
                                await this.initEditor();
                            }
                        });
                    },

                    determineContentType() {
                        if (!this.form.boardId) return;
                        const board = this.boards.find(b => b.id == this.form.boardId);
                        if (board) {
                            this.contentType = board.contentType || 'html';
                        }
                    },

                    async loadEditorResources() {
                        // 이미 로드된 에디터와 같은 타입이면 스킵
                        if (loadedEditorType === this.contentType) {
                            return;
                        }

                        // 이전 에디터 정리
                        this.cleanupEditor();

                        switch (this.contentType) {
                            case 'markdown':
                                await this.loadTuiEditorResources();
                                break;
                            case 'html':
                            case 'text':
                            default:
                                await this.loadQuillResources();
                                break;
                        }

                        loadedEditorType = this.contentType;
                    },

                    loadQuillResources() {
                        return new Promise((resolve) => {
                            const cssLink = document.getElementById('editor-css');
                            cssLink.href = 'https://cdn.quilljs.com/1.3.6/quill.snow.css';

                            // JS 스크립트가 이미 로드되어 있는지 확인
                            if (window.Quill) {
                                resolve();
                                return;
                            }

                            const script = document.createElement('script');
                            script.src = 'https://cdn.quilljs.com/1.3.6/quill.js';
                            script.onload = resolve;
                            document.head.appendChild(script);
                        });
                    },

                    async loadTuiEditorResources() {
                        return new Promise((resolve) => {
                            const cssLink = document.getElementById('editor-css');

                            // TUI Editor CSS 로드
                            if (!document.querySelector('link[href*="tui.editor"]')) {
                                const link1 = document.createElement('link');
                                link1.rel = 'stylesheet';
                                link1.href = 'https://uicdn.toast.com/editor/latest/toastui-editor.min.css';
                                document.head.appendChild(link1);

                                const link2 = document.createElement('link');
                                link2.rel = 'stylesheet';
                                link2.href = 'https://uicdn.toast.com/editor/latest/toastui-editor-dark.min.css';
                                document.head.appendChild(link2);
                            }

                            // TUI Editor JS 로드
                            if (window.toastui && window.toastui.Editor) {
                                resolve();
                                return;
                            }

                            const script1 = document.createElement('script');
                            script1.src = 'https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js';
                            script1.onload = resolve;
                            document.head.appendChild(script1);
                        });
                    },

                    cleanupEditor() {
                        // QuillJS 에디터 정리
                        if (quillEditor) {
                            quillEditor = null;
                        }

                        // TUI Editor 정리
                        if (tuiEditor) {
                            tuiEditor.destroy();
                            tuiEditor = null;
                        }

                        // 에디터 컨테이너 비우기
                        const quillContainer = document.getElementById('quill-editor');
                        const tuiContainer = document.getElementById('tui-editor');
                        if (quillContainer) quillContainer.innerHTML = '';
                        if (tuiContainer) tuiContainer.innerHTML = '';
                    },

                    async initEditor() {
                        switch (this.contentType) {
                            case 'markdown':
                                this.initTuiEditor();
                                break;
                            case 'html':
                                this.initQuillEditor();
                                break;
                            case 'text':
                                // textarea는 자동으로 x-model과 연결됨
                                break;
                        }
                    },

                    initQuillEditor() {
                        if (quillEditor) return;

                        quillEditor = new Quill('#quill-editor', {
                            theme: 'snow',
                            placeholder: '게시글 내용을 입력하세요',
                            modules: {
                                toolbar: [
                                    'bold', 'italic', 'underline', 'strike',
                                    { 'list': 'ordered' }, { 'list': 'bullet' },
                                    { 'header': [2, 3, false] },
                                    { 'color': [] },
                                    { 'align': [] },
                                    'link', 'image',
                                    'clean'
                                ]
                            }
                        });

                        // 내용 변경 감지
                        quillEditor.on('text-change', () => {
                            this.form.content = quillEditor.root.innerHTML;
                            document.getElementById('content').value = this.form.content;
                        });
                    },

                    initTuiEditor() {
                        if (tuiEditor) return;

                        tuiEditor = new toastui.Editor({
                            el: document.getElementById('tui-editor'),
                            height: '350px',
                            initialEditType: 'markdown',
                            previewStyle: 'tab',
                            placeholder: '게시글 내용을 입력하세요',
                            toolbarItems: [
                                ['heading', 'bold', 'italic'],
                                ['hr', 'quote'],
                                ['ul', 'ol', 'task', 'indent', 'outdent'],
                                ['table', 'image', 'link'],
                                ['code', 'codeblock'],
                                ['scrollSync']
                            ]
                        });

                        // 내용 변경 감지
                        tuiEditor.on('change', () => {
                            this.form.content = tuiEditor.getMarkdown();
                            document.getElementById('content').value = this.form.content;
                        });
                    },

                    async loadBoards() {
                        try {
                            const response = await fetch(APP_CTX + '/api/boards');
                            if (!response.ok) throw new Error('게시판 로드 실패');
                            const data = await response.json();
                            this.boards = Array.isArray(data.data) ? data.data : [];
                        } catch (err) {
                            this.error = err.message;
                        }
                    },

                    getBoardName() {
                        if (!this.form.boardId) return '';
                        const board = this.boards.find(b => b.id == this.form.boardId);
                        return board ? board.boardNameKor : '';
                    },

                    addNewFiles(event) {
                        const files = event.target.files;
                        for (let file of files) {
                            this.newFiles.push(file);
                        }
                        // 파일 선택 초기화
                        event.target.value = '';
                    },

                    removeNewFile(index) {
                        this.newFiles.splice(index, 1);
                    },

                    formatFileSize(bytes) {
                        if (bytes === 0) return '0 Bytes';
                        const k = 1024;
                        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                        const i = Math.floor(Math.log(bytes) / Math.log(k));
                        return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
                    },

                    goBack() {
                        window.history.back();
                    },

                    async save() {
                        if (!this.form.boardId) {
                            alert('게시판을 선택하세요.');
                            return;
                        }

                        if (!this.form.title.trim()) {
                            alert('제목을 입력하세요.');
                            return;
                        }

                        if (!this.form.baseYmd) {
                            alert('기준일을 선택하세요.');
                            return;
                        }

                        // contentType에 따른 content 검증
                        const isEmptyContent = this.contentType === 'html'
                            ? (!this.form.content || this.form.content === '<p><br></p>')
                            : !this.form.content || !this.form.content.trim();

                        if (isEmptyContent) {
                            alert('내용을 입력하세요.');
                            return;
                        }

                        this.saving = true;
                        try {
                            const formData = new FormData();
                            formData.append('boardId', this.form.boardId);
                            formData.append('title', this.form.title);
                            if (this.form.author.trim()) {
                                formData.append('author', this.form.author);
                            }
                            // 기준일을 YYYYMMDD 형식으로 변환
                            const baseYmdFormatted = this.form.baseYmd.replace(/-/g, '');
                            formData.append('baseYmd', baseYmdFormatted);
                            formData.append('content', this.form.content);

                            // 파일 추가
                            for (let file of this.newFiles) {
                                formData.append('files', file);
                            }

                            const response = await fetch(APP_CTX + '/api/posts', {
                                method: 'POST',
                                body: formData,
                                credentials: 'include'
                            });

                            if (!response.ok) {
                                const errorData = await response.json();
                                throw new Error(errorData.message || '저장에 실패했습니다.');
                            }

                            const result = await response.json();
                            alert('게시글이 작성되었습니다.');
                            window.location.href = `${APP_CTX}/posts/${result.data.id}`;
                        } catch (err) {
                            this.error = err.message;
                            alert(err.message);
                            console.error(err);
                        } finally {
                            this.saving = false;
                        }
                    }
                }
            }
        </script>
    </main>
</body>

</html>
