<header th:fragment="header" class="navbar bg-base-100 shadow-md sticky top-0 z-50">
    <div class="navbar-start">
        <!-- Logo -->
        <a th:href="@{/}" class="flex items-center gap-2 btn btn-ghost normal-case text-xl">
            <div class="w-8 h-8 bg-primary rounded flex items-center justify-center text-white font-bold">
                K
            </div>
            <span>KalpaDB</span>
        </a>
    </div>

    <!-- Desktop Menu (Authenticated users) -->
    <div th:if="${#authentication.name != 'anonymousUser'}" class="navbar-center flex gap-2">
        <!-- Diary Menu -->
        <div class="dropdown dropdown-hover">
            <button type="button" class="btn btn-ghost">📖 일지</button>
            <ul class="dropdown-content menu bg-base-100 rounded-box z-[1] w-64 p-2 shadow">
                <li><a th:href="@{/diary/new}">✏️ 일지기록</a></li>
                <li><a th:href="@{/diary}">🔍 일지찾기</a></li>
                <li><a th:href="@{/calendar}">📅 달력</a></li>
            </ul>
        </div>

        <!-- Board Menu -->
        <div class="dropdown dropdown-hover">
            <button type="button" class="btn btn-ghost">📝 게시판</button>
            <ul class="dropdown-content menu bg-base-100 rounded-box z-[1] w-64 p-2 shadow">
                <li><a th:href="@{/boards}">✍️ 게시판관리</a></li>
            </ul>
        </div>

        <!-- Tech Menu -->
        <div class="dropdown dropdown-hover">
            <button type="button" class="btn btn-ghost">🔧 Tech</button>
            <ul class="dropdown-content menu bg-base-100 rounded-box z-[1] w-64 p-2 shadow">
                <li><a th:href="@{/jangbi}">🖥️ 장비</a></li>
                <li><a th:href="@{/apnode}">📂 파일관리</a></li>
            </ul>
        </div>
    </div>

    <!-- Right Side -->
    <div class="navbar-end gap-2">
        <!-- User Menu (Authenticated users) -->
        <div th:if="${#authentication.name != 'anonymousUser'}" class="dropdown dropdown-end">
            <button type="button" class="btn btn-ghost btn-circle avatar placeholder" title="사용자 메뉴">
                <div class="bg-primary text-white rounded-full w-10">
                    <span th:text="${#authentication.name.substring(0, 1)}">U</span>
                </div>
            </button>
            <ul class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52">
                <li><a th:href="@{/settings/edit}">⚙️ 설정</a></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit">🚪 로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>

        <!-- Login Button (Not authenticated) -->
        <div th:if="${#authentication.name == 'anonymousUser'}">
            <a th:href="@{/login}" class="btn btn-sm btn-primary">로그인</a>
        </div>

    </div>
</header>
