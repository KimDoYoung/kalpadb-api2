<header th:fragment="header" class="bg-white border-b border-gray-100 sticky top-0 z-50 transition-all duration-300">
    <nav class="bg-white" x-data="{ activeMenu: null, mobileMenuOpen: false }">
        <div class="container mx-auto px-6 h-16 flex items-center justify-between">
            
            <!-- Left Side: Logo + Desktop Menu -->
            <div class="flex items-center gap-8">
                <!-- Logo -->
                <a th:href="@{/}" class="flex items-center gap-2.5 group">
                    <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md group-hover:bg-blue-700 transition-colors">
                        K
                    </div>
                    <span class="text-xl font-bold text-gray-800 tracking-tight group-hover:text-blue-600 transition-colors">
                        KalpaDB
                    </span>
                </a>

                <!-- Desktop Menu (Hidden on mobile, Visible on md+) -->
                <div th:if="${#authentication.name != 'anonymousUser'}" class="hidden md:flex items-center gap-1">
                    
                    <!-- 1. Diary Menu -->
                    <div class="relative">
                        <button 
                            @click="activeMenu = (activeMenu === 'diary' ? null : 'diary')"
                            @click.outside="if(activeMenu === 'diary') activeMenu = null"
                            class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-all duration-200"
                            :class="activeMenu === 'diary' ? 'bg-blue-50 text-blue-600' : ''"
                        >
                            <span>📖 일지</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 transition-transform duration-200" :class="activeMenu === 'diary' ? 'rotate-180 opacity-100' : 'opacity-50'" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <!-- Dropdown -->
                        <div 
                            x-show="activeMenu === 'diary'" 
                            x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 translate-y-1 scale-95"
                            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                            x-transition:leave="transition ease-in duration-150"
                            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                            x-transition:leave-end="opacity-0 translate-y-1 scale-95"
                            class="absolute left-0 mt-2 w-48 bg-white rounded-xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)] border border-gray-100 overflow-hidden z-20"
                            x-cloak
                        >
                            <div class="py-1.5">
                                <a th:href="@{/diary/new}" class="block px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 font-medium transition-colors">✏️ 일지기록</a>
                                <a th:href="@{/diary}" class="block px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 font-medium transition-colors">🔍 일지찾기</a>
                                <a th:href="@{/calendar}" class="block px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 font-medium transition-colors">📅 달력</a>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Board Menu -->
                    <div class="relative">
                        <button 
                            @click="activeMenu = (activeMenu === 'board' ? null : 'board')"
                            @click.outside="if(activeMenu === 'board') activeMenu = null"
                            class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-all duration-200"
                            :class="activeMenu === 'board' ? 'bg-blue-50 text-blue-600' : ''"
                        >
                            <span>📝 게시판</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 transition-transform duration-200" :class="activeMenu === 'board' ? 'rotate-180 opacity-100' : 'opacity-50'" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <!-- Dropdown -->
                        <div 
                            x-show="activeMenu === 'board'" 
                            x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 translate-y-1 scale-95"
                            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                            x-transition:leave="transition ease-in duration-150"
                            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                            x-transition:leave-end="opacity-0 translate-y-1 scale-95"
                            class="absolute left-0 mt-2 w-48 bg-white rounded-xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)] border border-gray-100 overflow-hidden z-20"
                            x-cloak
                        >
                            <div class="py-1.5">
                                <a th:href="@{/essay}" class="block px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 font-medium transition-colors">✍️ Essay</a>
                                <a th:href="@{/notes}" class="block px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 font-medium transition-colors">💡 기술노트</a>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Tech Menu -->
                    <div class="relative">
                        <button 
                            @click="activeMenu = (activeMenu === 'tech' ? null : 'tech')"
                            @click.outside="if(activeMenu === 'tech') activeMenu = null"
                            class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-all duration-200"
                            :class="activeMenu === 'tech' ? 'bg-blue-50 text-blue-600' : ''"
                        >
                            <span>🔧 Tech</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 transition-transform duration-200" :class="activeMenu === 'tech' ? 'rotate-180 opacity-100' : 'opacity-50'" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <!-- Dropdown -->
                        <div 
                            x-show="activeMenu === 'tech'" 
                            x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 translate-y-1 scale-95"
                            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                            x-transition:leave="transition ease-in duration-150"
                            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                            x-transition:leave-end="opacity-0 translate-y-1 scale-95"
                            class="absolute left-0 mt-2 w-48 bg-white rounded-xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)] border border-gray-100 overflow-hidden z-20"
                            x-cloak
                        >
                            <div class="py-1.5">
                                <a th:href="@{/jangbi}" class="block px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 font-medium transition-colors">🖥️ 장비</a>
                                <a th:href="@{/files}" class="block px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 font-medium transition-colors">📂 파일관리</a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Right Side: User & Hamburger -->
            <div class="flex items-center gap-4">
                
                <!-- Desktop User Profile -->
                <div th:if="${#authentication.name != 'anonymousUser'}" class="hidden md:flex items-center gap-3 pl-6 border-l border-gray-100">
                    <span class="text-sm font-medium text-gray-600">
                         <span th:text="${#authentication.name}">User</span>
                     </span>
                     <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit" class="text-xs px-3 py-1.5 rounded-full border border-gray-200 hover:bg-gray-50 hover:text-red-500 hover:border-red-200 transition-colors">
                            로그아웃
                        </button>
                    </form>
                </div>
                
                <!-- Login Button (Visible if not authenticated) -->
                <div th:if="${#authentication.name == 'anonymousUser'}" class="hidden md:block">
                     <a th:href="@{/login}" class="text-sm font-medium text-blue-600 hover:text-blue-700">로그인</a>
                </div>

                <!-- Mobile Hamburger Button -->
                <button 
                    @click="mobileMenuOpen = !mobileMenuOpen" 
                    class="md:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-50 focus:outline-none"
                    aria-label="Toggle menu"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        <path x-show="mobileMenuOpen" x-cloak stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu (Expandable Panel) -->
        <div
            x-show="mobileMenuOpen"
            x-collapse
            class="md:hidden border-t border-gray-100 bg-white"
            x-cloak
            th:if="${#authentication.name != 'anonymousUser'}"
        >
            <div class="px-4 py-6 space-y-4">
                
                <!-- Mobile Diary -->
                <div x-data="{ open: false }">
                    <button @click="open = !open" class="flex items-center justify-between w-full px-2 py-2 text-base font-medium text-gray-700 hover:bg-gray-50 rounded-lg">
                        <span class="flex items-center gap-2">📔 일지</span>
                        <svg class="w-4 h-4 text-gray-400 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </button>
                    <div x-show="open" x-collapse class="pl-8 space-y-2 mt-1">
                        <a th:href="@{/diary/new}" class="block py-2 text-sm text-gray-500 hover:text-blue-600">일지기록</a>
                        <a th:href="@{/diary}" class="block py-2 text-sm text-gray-500 hover:text-blue-600">일지찾기</a>
                        <a th:href="@{/calendar}" class="block py-2 text-sm text-gray-500 hover:text-blue-600">달력</a>
                    </div>
                </div>

                <!-- Mobile Board -->
                <div x-data="{ open: false }">
                    <button @click="open = !open" class="flex items-center justify-between w-full px-2 py-2 text-base font-medium text-gray-700 hover:bg-gray-50 rounded-lg">
                        <span class="flex items-center gap-2">📝 게시판</span>
                        <svg class="w-4 h-4 text-gray-400 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </button>
                    <div x-show="open" x-collapse class="pl-8 space-y-2 mt-1">
                        <a th:href="@{/essay}" class="block py-2 text-sm text-gray-500 hover:text-blue-600">Essay</a>
                        <a th:href="@{/notes}" class="block py-2 text-sm text-gray-500 hover:text-blue-600">기술노트</a>
                    </div>
                </div>

                 <!-- Mobile Tech -->
                 <div x-data="{ open: false }">
                    <button @click="open = !open" class="flex items-center justify-between w-full px-2 py-2 text-base font-medium text-gray-700 hover:bg-gray-50 rounded-lg">
                        <span class="flex items-center gap-2">🔧 Tech</span>
                        <svg class="w-4 h-4 text-gray-400 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </button>
                    <div x-show="open" x-collapse class="pl-8 space-y-2 mt-1">
                        <a th:href="@{/jangbi}" class="block py-2 text-sm text-gray-500 hover:text-blue-600">장비</a>
                        <a th:href="@{/files}" class="block py-2 text-sm text-gray-500 hover:text-blue-600">파일관리</a>
                    </div>
                </div>
                
                <div class="h-px bg-gray-100 my-4"></div>

                <!-- Mobile User Info -->
                <div class="px-2 flex items-center justify-between">
                    <span class="text-sm font-medium text-gray-600">
                        <span th:text="${#authentication.name}">User</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit" class="text-xs px-3 py-1.5 rounded-full border border-gray-200 text-gray-600">로그아웃</button>
                    </form>
                </div>

            </div>
        </div>
        
        <!-- Mobile Menu (Not Authenticated) -->
         <div
            x-show="mobileMenuOpen"
            x-collapse
            class="md:hidden border-t border-gray-100 bg-white"
            x-cloak
            th:if="${#authentication.name == 'anonymousUser'}"
        >
             <div class="px-4 py-6">
                <a th:href="@{/login}" class="block w-full text-center py-2 text-sm font-medium text-blue-600 border border-blue-200 rounded-lg bg-blue-50">로그인</a>
             </div>
        </div>

    </nav>
</header>
