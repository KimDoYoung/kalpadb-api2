<header th:fragment="header" class="navbar bg-base-100 shadow-md sticky top-0 z-50">
    <div class="navbar-start">
        <!-- Logo -->
        <a th:href="@{/}" class="flex items-center gap-2 btn btn-ghost normal-case text-xl">
            <div class="w-8 h-8 bg-primary rounded flex items-center justify-center text-white font-bold">
                K
            </div>
            <span>KalpaDB</span>
        </a>
    </div>

    <!-- Desktop Menu (Authenticated users) -->
    <div th:if="${#authentication.name != 'anonymousUser'}" class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1 gap-1">
            <!-- Diary Menu -->
            <li>
                <details>
                    <summary>📖 일지</summary>
                    <ul class="bg-base-100 rounded-t-none">
                        <li><a th:href="@{/diary/new}">✏️ 일지기록</a></li>
                        <li><a th:href="@{/diary}">🔍 일지찾기</a></li>
                        <li><a th:href="@{/calendar}">📅 달력</a></li>
                    </ul>
                </details>
            </li>

            <!-- Board Menu -->
            <li>
                <details>
                    <summary>📝 게시판</summary>
                    <ul class="bg-base-100 rounded-t-none">
                        <li><a th:href="@{/boards}">✍️ 게시판관리</a></li>
                    </ul>
                </details>
            </li>

            <!-- Tech Menu -->
            <li>
                <details>
                    <summary>🔧 Tech</summary>
                    <ul class="bg-base-100 rounded-t-none">
                        <li><a th:href="@{/jangbi}">🖥️ 장비</a></li>
                        <li><a th:href="@{/apnode}">📂 파일관리</a></li>
                    </ul>
                </details>
            </li>
        </ul>
    </div>

    <!-- Right Side -->
    <div class="navbar-end gap-2">
        <!-- Theme Toggle -->
        <button type="button" @click="window.toggleTheme()" class="btn btn-sm btn-ghost" title="테마 변경">
            🌙 / ☀️
        </button>

        <!-- User Menu (Authenticated users) -->
        <div th:if="${#authentication.name != 'anonymousUser'}" class="dropdown dropdown-end">
            <button type="button" class="btn btn-ghost btn-circle avatar placeholder" title="사용자 메뉴">
                <div class="bg-primary text-white">
                    <span th:text="${#authentication.name.substring(0, 1)}">U</span>
                </div>
            </button>
            <ul class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52">
                <li><a th:href="@{/settings/edit}">⚙️ 설정</a></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit">🚪 로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>

        <!-- Login Button (Not authenticated) -->
        <div th:if="${#authentication.name == 'anonymousUser'}">
            <a th:href="@{/login}" class="btn btn-sm btn-primary">로그인</a>
        </div>

        <!-- Mobile Menu Toggle -->
        <div class="dropdown dropdown-end lg:hidden">
            <button type="button" class="btn btn-ghost btn-circle" title="메뉴">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
                </svg>
            </button>
            <ul class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52">
                <li th:if="${#authentication.name != 'anonymousUser'}">
                    <a th:href="@{/diary/new}">✏️ 일지기록</a>
                </li>
                <li th:if="${#authentication.name != 'anonymousUser'}">
                    <a th:href="@{/diary}">🔍 일지찾기</a>
                </li>
                <li th:if="${#authentication.name != 'anonymousUser'}">
                    <a th:href="@{/calendar}">📅 달력</a>
                </li>
                <li th:if="${#authentication.name != 'anonymousUser'}">
                    <a th:href="@{/boards}">✍️ 게시판관리</a>
                </li>
                <li th:if="${#authentication.name != 'anonymousUser'}">
                    <a th:href="@{/jangbi}">🖥️ 장비</a>
                </li>
                <li th:if="${#authentication.name != 'anonymousUser'}">
                    <a th:href="@{/apnode}">📂 파일관리</a>
                </li>
            </ul>
        </div>
    </div>
</header>
