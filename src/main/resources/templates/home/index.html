<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>홈 - KalpaDB</title>
</head>
<body>
<main layout:fragment="content">
    <div class="text-center py-12">
        <h2 class="text-4xl font-bold text-gray-800 mb-4">
            <span th:if="${#authentication != null and #authentication.isAuthenticated()}">
                <span th:text="${#authentication.name}"></span>님의 개인 정보 관리 시스템
            </span>
            <span th:unless="${#authentication != null and #authentication.isAuthenticated()}">
                KalpaDB에 오신 것을 환영합니다
            </span>
        </h2>
        <p class="text-gray-600 text-lg mb-8">
            일기, TODO, 독서, 영화, 노트 등 개인의 모든 정보를 한 곳에서 관리하세요.
        </p>

        <div th:unless="${#authentication != null and #authentication.isAuthenticated()}" class="space-y-4">
            <p class="text-gray-700 mb-6">더 많은 기능을 사용하려면 로그인해주세요.</p>
            <a th:href="@{/login}" class="inline-block btn-primary">
                로그인
            </a>
        </div>

        <!-- 로그인한 사용자를 위한 크イック 링크 -->
        <div th:if="${#authentication != null and #authentication.isAuthenticated()}" class="mt-12">
            <h3 class="text-2xl font-bold text-gray-800 mb-8">주요 기능</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                <a th:href="@{/diary}" class="card hover:shadow-lg transition">
                    <div class="text-4xl mb-2">📔</div>
                    <h4 class="font-bold text-gray-800">일기</h4>
                    <p class="text-sm text-gray-600">매일의 생각을 기록하세요</p>
                </a>

                <a th:href="@{/todo}" class="card hover:shadow-lg transition">
                    <div class="text-4xl mb-2">✓</div>
                    <h4 class="font-bold text-gray-800">TODO</h4>
                    <p class="text-sm text-gray-600">해야 할 일을 관리하세요</p>
                </a>

                <a th:href="@{/books}" class="card hover:shadow-lg transition">
                    <div class="text-4xl mb-2">📚</div>
                    <h4 class="font-bold text-gray-800">독서</h4>
                    <p class="text-sm text-gray-600">읽은 책을 기록하세요</p>
                </a>

                <a th:href="@{/movies}" class="card hover:shadow-lg transition">
                    <div class="text-4xl mb-2">🎬</div>
                    <h4 class="font-bold text-gray-800">영화</h4>
                    <p class="text-sm text-gray-600">본 영화를 평가하세요</p>
                </a>

                <a th:href="@{/essay}" class="card hover:shadow-lg transition">
                    <div class="text-4xl mb-2">✍️</div>
                    <h4 class="font-bold text-gray-800">에세이</h4>
                    <p class="text-sm text-gray-600">생각을 글로 남기세요</p>
                </a>

                <a th:href="@{/notes}" class="card hover:shadow-lg transition">
                    <div class="text-4xl mb-2">📝</div>
                    <h4 class="font-bold text-gray-800">노트</h4>
                    <p class="text-sm text-gray-600">기술 정보를 저장하세요</p>
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
