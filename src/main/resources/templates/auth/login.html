<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - KalpaDB</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
            <!-- 로고 -->
            <div class="text-center mb-8">
               <h1 class="text-3xl font-bold text-gray-800">KalpaDB</h1>
                <p class="text-gray-600 mt-2">개인 정보 관리 시스템</p>
            </div>

            <!-- 에러 메시지 -->
            <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
                <p>로그인 실패. 아이디와 비밀번호를 확인하세요.</p>
            </div>

            <!-- 로그인 폼 -->
            <form th:action="@{/login}" method="post" class="space-y-4">
                <!-- 사용자 ID -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                        사용자 ID
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="아이디를 입력하세요"
                    >
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        비밀번호
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="비밀번호를 입력하세요"
                    >
                </div>

                <!-- 숫자 패드 -->
                <div class="mt-6 p-4 bg-gray-100 rounded-lg">
                    <p class="text-xs text-gray-600 mb-3 text-center">또는 버튼으로 입력하세요</p>

                    <!-- 숫자 버튼 (1-9) -->
                    <div class="grid grid-cols-3 gap-2 mb-2">
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '1')">1</button>
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '2')">2</button>
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '3')">3</button>

                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '4')">4</button>
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '5')">5</button>
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '6')">6</button>

                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '7')">7</button>
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '8')">8</button>
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '9')">9</button>
                    </div>

                    <!-- 0과 제어 버튼 -->
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded" onclick="clearPassword(event)">x</button>
                        <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded" onclick="addToPassword(event, '0')">0</button>
                        <button type="button" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded" onclick="deleteLastPassword(event)">&lt;-</button>
                    </div>
                </div>

                <!-- 로그인 버튼-->
                <button
                    type="submit"
                    class="w-full btn-primary py-3 font-semibold"
                >
                    로그인
                </button>
            </form>

            <!-- 홈으로 돌아가기 -->
            <div class="text-center mt-6">
                <a th:href="@{/}" class="text-blue-500 hover:text-blue-600">
                    홈으로 돌아가기
                </a>
            </div>
        </div>
    </div>

    <script>
        // 비밀번호 필드에 숫자 추가
        function addToPassword(event, number) {
            event.preventDefault();
            const passwordField = document.getElementById('password');
            passwordField.value += number;
        }

        // 비밀번호 필드 마지막 문자 삭제
        function deleteLastPassword(event) {
            event.preventDefault();
            const passwordField = document.getElementById('password');
            passwordField.value = passwordField.value.slice(0, -1);
        }

        // 비밀번호 필드 전체 삭제
        function clearPassword(event) {
            event.preventDefault();
            const passwordField = document.getElementById('password');
            passwordField.value = '';
        }
    </script>
</body>
</html>
