<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>로그인 - KalpaDB</title>
</head>
<body>
<main layout:fragment="content">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
            <!-- 로고 -->
            <div class="text-center mb-8">
               <h1 class="text-3xl font-bold text-gray-800">KalpaDB</h1>
                <p class="text-gray-600 mt-2">개인 정보 관리 시스템</p>
            </div>

            <!-- 에러 메시지 -->
            <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
                <p>로그인 실패. 아이디와 비밀번호를 확인하세요.</p>
            </div>

            <!-- 로그인 폼 -->
            <form id="loginForm" th:action="@{/login}" method="post" class="space-y-4">
                <!-- 사용자 ID -->
                <div class="auth-form-group">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                        사용자 ID
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="아이디를 입력하세요"
                    >
                </div>

                <!-- 비밀번호 -->
                <div class="auth-form-group">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        비밀번호
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="비밀번호를 입력하세요"
                    >
                </div>

                <!-- 숫자 패드 -->
                <div class="numeric-pad">
                    <button type="button" data-number="1">1</button>
                    <button type="button" data-number="2">2</button>
                    <button type="button" data-number="3">3</button>
                    <button type="button" data-number="4">4</button>
                    <button type="button" data-number="5">5</button>
                    <button type="button" data-number="6">6</button>
                    <button type="button" data-number="7">7</button>
                    <button type="button" data-number="8">8</button>
                    <button type="button" data-number="9">9</button>
                    <button type="button" data-number="0">0</button>
                    <button type="button" class="delete-btn">삭제</button>
                    <button type="button" class="clear-btn">초기화</button>
                </div>

                <!-- 로그인 버튼-->
                <button
                    type="submit"
                    class="w-full btn-primary py-3 font-semibold"
                >
                    로그인
                </button>
            </form>

            <!-- 홈으로 돌아가기 -->
            <div class="text-center mt-6">
                <a th:href="@{/}" class="text-blue-500 hover:text-blue-600">
                    홈으로 돌아가기
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
