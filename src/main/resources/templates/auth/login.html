<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - KalpaDB</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
            <!-- 로고 -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-500 rounded-lg flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4">
                    K
                </div>
                <h1 class="text-3xl font-bold text-gray-800">KalpaDB</h1>
                <p class="text-gray-600 mt-2">개인 정보 관리 시스템</p>
            </div>

            <!-- 에러 메시지 -->
            <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
                <p>로그인 실패. 아이디와 비밀번호를 확인하세요.</p>
            </div>

            <!-- 로그인 폼 -->
            <form th:action="@{/login}" method="post" class="space-y-4">
                <!-- 사용자 ID -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                        사용자 ID
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="아이디를 입력하세요"
                    >
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        비밀번호
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="비밀번호를 입력하세요"
                    >
                </div>

                <!-- 로그인 버튼 -->
                <button
                    type="submit"
                    class="w-full btn-primary py-3 font-semibold"
                >
                    로그인
                </button>
            </form>

            <!-- 홈으로 돌아가기 -->
            <div class="text-center mt-6">
                <a th:href="@{/}" class="text-blue-500 hover:text-blue-600">
                    홈으로 돌아가기
                </a>
            </div>
        </div>
    </div>
</body>
</html>
