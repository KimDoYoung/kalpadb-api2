<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>일기 작성 - KalpaDB</title>
    <!-- QuillJS CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
<main layout:fragment="content">
    <div x-data="diaryCreate()" x-init="init()" class="space-y-6">
        <!-- 에러 메시지 -->
        <div x-show="error" class="alert alert-error" x-cloak>
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
            </svg>
            <p x-text="error"></p>
        </div>

        <!-- 페이지 헤더 -->
        <div class="card bg-base-100 shadow-md">
            <div class="card-body">
                <h1 class="text-3xl font-bold text-base-content">✏️ 새 일기 작성</h1>
            </div>
        </div>

        <!-- 폼 -->
        <div class="space-y-6">
            <!-- 날짜 -->
            <div class="form-control w-full">
                <label for="ymd" class="label">
                    <span class="label-text font-medium">날짜</span>
                </label>
                <input
                    type="date"
                    id="ymd"
                    x-model="form.ymd"
                    class="input input-bordered w-full focus:input-primary"
                    required
                >
            </div>

            <!-- 요약 -->
            <div class="form-control w-full">
                <label for="summary" class="label">
                    <span class="label-text font-medium">요약 (선택사항)</span>
                </label>
                <input
                    type="text"
                    id="summary"
                    x-model="form.summary"
                    class="input input-bordered w-full focus:input-primary"
                    placeholder="한 줄 요약"
                    maxlength="300"
                >
            </div>

            <!-- 내용 (QuillJS 에디터) -->
            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text font-medium">내용</span>
                </label>
                <div id="quill-editor" class="w-full"></div>
                <input type="hidden" id="content" x-model="form.content">
            </div>

            <!-- 첨부파일 -->
            <div class="divider my-6"></div>
            <div class="space-y-4">
                <h3 class="text-lg font-bold text-base-content">📎 첨부파일</h3>

                <!-- 새 파일 업로드 -->
                <div class="form-control w-full">
                    <label for="file-input" class="label">
                        <span class="label-text font-medium">파일 추가</span>
                    </label>
                    <input
                        type="file"
                        id="file-input"
                        @change="addNewFiles($event)"
                        multiple
                        class="file-input file-input-bordered w-full focus:file-input-primary"
                    >
                    <label class="label">
                        <span class="label-text-alt text-base-content/60">여러 파일을 선택할 수 있습니다</span>
                    </label>
                </div>

                <!-- 추가된 파일 목록 -->
                <div x-show="newFiles.length > 0" class="space-y-2">
                    <h4 class="text-sm font-medium text-base-content">추가된 파일</h4>
                    <template x-for="(file, index) in newFiles" :key="index">
                        <div class="flex items-center justify-between bg-primary/10 p-3 rounded border border-primary/20">
                            <div class="flex-1">
                                <p class="text-sm text-base-content" x-text="file.name"></p>
                                <p class="text-xs text-base-content/60" x-text="'(' + formatFileSize(file.size) + ')'"></p>
                            </div>
                            <button
                                type="button"
                                @click="removeNewFile(index)"
                                class="btn btn-sm btn-ghost text-error"
                            >
                                삭제
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- 버튼 -->
            <div class="divider my-6"></div>
            <div class="flex gap-3 justify-end">
                <a th:href="@{/diary}" class="btn btn-ghost">취소</a>
                <button @click="save()" class="btn btn-primary" :disabled="saving">
                    <span x-show="!saving">저장</span>
                    <span x-show="saving">
                        <span class="loading loading-spinner loading-sm"></span>
                        저장 중...
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- QuillJS JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <style>
        #quill-editor {
            border: 1px solid hsl(var(--b2)) !important;
            border-radius: 0.5rem !important;
        }

        /* Toolbar 스타일 */
        .ql-toolbar.ql-snow {
            border-top-left-radius: 0.5rem !important;
            border-top-right-radius: 0.5rem !important;
            background-color: hsl(var(--b1)) !important;
            border: 1px solid hsl(var(--b2)) !important;
            border-bottom: 1px solid hsl(var(--b2)) !important;
        }

        /* Toolbar 버튼 활성 상태 */
        .ql-toolbar.ql-snow button:hover,
        .ql-toolbar.ql-snow button.ql-active {
            color: hsl(var(--p)) !important;
        }

        .ql-toolbar.ql-snow button.ql-active .ql-stroke {
            stroke: hsl(var(--p)) !important;
        }

        .ql-toolbar.ql-snow button.ql-active .ql-fill {
            fill: hsl(var(--p)) !important;
        }

        /* Editor 컨테이너 */
        .ql-container.ql-snow {
            border-bottom-left-radius: 0.5rem !important;
            border-bottom-right-radius: 0.5rem !important;
            border: none !important;
            font-size: 14px !important;
        }

        .ql-editor {
            padding: 12px !important;
            min-height: 350px !important;
            max-height: 400px !important;
            overflow-y: auto !important;
            background-color: hsl(var(--b1)) !important;
        }

        .ql-editor.ql-blank::before {
            color: hsl(var(--bc) / 0.6) !important;
        }
    </style>
    <script>
        let quillEditor;

        function diaryCreate() {
            return {
                form: {
                    ymd: new Date().toISOString().split('T')[0], // YYYY-MM-DD 형식
                    summary: '',
                    content: ''
                },
                newFiles: [],
                saving: false,
                error: '',

                async init() {
                    if (quillEditor) return;

                    // QuillJS 에디터 초기화
                    quillEditor = new Quill('#quill-editor', {
                        theme: 'snow',
                        placeholder: '일기 내용을 입력하세요',
                        modules: {
                            toolbar: [
                                'bold', 'italic', 'underline', 'strike',
                                { 'list': 'ordered'}, { 'list': 'bullet' },
                                { 'header': [2, 3, false] },
                                { 'color': [] },
                                { 'align': [] },
                                'clean'
                            ]
                        }
                    });

                    // 내용 변경 감지
                    quillEditor.on('text-change', () => {
                        this.form.content = quillEditor.root.innerHTML;
                        document.getElementById('content').value = this.form.content;
                    });
                },

                addNewFiles(event) {
                    const files = event.target.files;
                    for (let file of files) {
                        this.newFiles.push(file);
                    }
                    // 파일 선택 초기화
                    event.target.value = '';
                },

                removeNewFile(index) {
                    this.newFiles.splice(index, 1);
                },

                formatFileSize(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
                },

                async save() {
                    if (!this.form.ymd) {
                        alert('날짜를 입력하세요.');
                        return;
                    }

                    if (!this.form.content || this.form.content === '<p><br></p>') {
                        alert('내용을 입력하세요.');
                        return;
                    }

                    this.saving = true;
                    try {
                        const formData = new FormData();
                        // 날짜를 YYYYMMDD 형식으로 변환 (YYYY-MM-DD -> YYYYMMDD)
                        const ymdFormatted = this.form.ymd.replace(/-/g, '');
                        formData.append('ymd', ymdFormatted);
                        formData.append('summary', this.form.summary);
                        formData.append('content', this.form.content);

                        // 새 파일 추가
                        for (let file of this.newFiles) {
                            formData.append('files', file);
                        }

                        const response = await fetch('/api/diary', {
                            method: 'POST',
                            body: formData,
                            credentials: 'include'
                        });

                        if (!response.ok) {
                            const errorData = await response.json();
                            throw new Error(errorData.message || '저장에 실패했습니다.');
                        }

                        alert('저장되었습니다.');
                        window.location.href = `/diary/${ymdFormatted}`;
                    } catch (err) {
                        this.error = err.message;
                        alert(err.message);
                        console.error(err);
                    } finally {
                        this.saving = false;
                    }
                }
            }
        }
    </script>
</main>
</body>
</html>
