<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>일기 상세 - KalpaDB</title>
    <!-- QuillJS CSS (읽기 전용 스타일링) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
<main layout:fragment="content">
    <div x-data="diaryDetail()" x-init="init()">
        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-600">로딩 중...</p>
        </div>

        <!-- 에러 메시지 및 네비게이션 -->
        <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <p x:text="error"></p>
            <div class="flex gap-3 mt-4">
                <a :href="APP_CTX + '/diary/new?ymd=' + ymd" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors inline-flex items-center">작성하기</a>
                <a :href="APP_CTX + '/diary/' + getPreviousDay()" class="px-6 py-2 bg-gray-400 text-white font-semibold rounded-lg hover:bg-gray-500 active:bg-gray-600 transition-colors inline-flex items-center">← 이전일</a>
                <a :href="APP_CTX + '/diary/' + getNextDay()" class="px-6 py-2 bg-gray-400 text-white font-semibold rounded-lg hover:bg-gray-500 active:bg-gray-600 transition-colors inline-flex items-center">다음일 →</a>
            </div>
        </div>

        <!-- 일기 상세 -->
        <div x-show="!loading && diary.ymd" class="space-y-6">
            <!-- 헤더 -->
            <div class="flex justify-between items-start border-b pb-4">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800" x-text="formatDateWithDay(diary.ymd)"></h2>
                    <p class="text-gray-600 mt-2" x-text="diary.summary || '(요약 없음)'"></p>
                </div>
                <div class="flex gap-2">
                    <a :href="APP_CTX + '/diary/' + diary.ymd + '/edit'" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors">수정</a>
                    <button @click="deleteDiary()" class="px-6 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 active:bg-red-800 transition-colors">삭제</button>
                </div>
            </div>

            <!-- 내용 -->
            <div class="bg-white rounded-lg p-6">
                <div class="ql-editor" x-html="diary.content || '(내용 없음)'"></div>
            </div>

            <!-- 첨부파일 -->
            <div class="border-t pt-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">📎 첨부파일</h3>
                <template x-if="attachedFiles.length > 0">
                    <div class="space-y-2">
                        <template x-for="file in attachedFiles" :key="file.fileId">
                            <div class="flex items-center justify-between bg-gray-50 p-3 rounded border border-gray-200">
                                <div class="flex-1">
                                    <a :href="APP_CTX + '/api/file/download/' + file.fileId"
                                       class="text-blue-500 hover:text-blue-700 font-medium"
                                       x-text="file.orgFileName">
                                    </a>
                                    <p class="text-xs text-gray-500" x-text="'(' + formatFileSize(file.fileSize) + ')'"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
                <template x-if="attachedFiles.length === 0">
                    <p class="text-gray-600">첨부파일이 없습니다.</p>
                </template>
            </div>

            <!-- 뒤로가기 -->
            <div class="flex justify-between items-center">
                <a th:href="@{/diary}" class="px-6 py-2 bg-gray-500 text-white font-semibold rounded-lg hover:bg-gray-600 active:bg-gray-700 transition-colors inline-flex items-center gap-2">← 목록으로</a>
            </div>
        </div>
    </div>

    <script>
        function diaryDetail() {
            const pathname = window.location.pathname.replace(APP_CTX, '');
            const ymd = pathname.split('/')[2];

            return {
                ymd: ymd,
                diary: {
                    ymd: '',
                    summary: '',
                    content: ''
                },
                attachedFiles: [],
                loading: true,
                error: '',

                async init() {
                    try {
                        const response = await fetch(`${APP_CTX}/api/diary/${this.ymd}`);
                        if (!response.ok) {
                            throw new Error('이 날짜에는 기록이 없습니다.');
                        }
                        const data = await response.json();
                        this.diary = data.data || data;

                        // 첨부파일 로드
                        await this.loadAttachedFiles();
                    } catch (err) {
                        this.error = err.message;
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },

                async loadAttachedFiles() {
                    try {
                        console.log(`첨부파일 로드 시작: /api/diary/${this.ymd}/files`);
                        const response = await fetch(`${APP_CTX}/api/diary/${this.ymd}/files`);
                        if (response.ok) {
                            const data = await response.json();
                            console.log('첨부파일 로드 성공:', data);
                            this.attachedFiles = data.data || [];
                            console.log(`로드된 파일 개수: ${this.attachedFiles.length}`);
                        } else {
                            console.warn(`첨부파일 조회 실패: ${response.status}`);
                        }
                    } catch (err) {
                        console.error('파일 로드 실패:', err);
                    }
                },

                async deleteDiary() {
                    if (confirm('정말 삭제하시겠습니까? (첨부파일은 보존됩니다)')) {
                        try {
                            const response = await fetch(`${APP_CTX}/api/diary/${this.ymd}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });
                            if (response.ok) {
                                alert('삭제되었습니다.');
                                window.location.href = APP_CTX + '/diary';
                            } else {
                                throw new Error('삭제에 실패했습니다.');
                            }
                        } catch (err) {
                            alert(err.message);
                            console.error(err);
                        }
                    }
                },

                formatDate(ymd) {
                    if (!ymd || ymd.length !== 8) return ymd;
                    return `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
                },

                formatDateWithDay(ymd) {
                    if (!ymd || ymd.length !== 8) return ymd;

                    const year = ymd.substring(0, 4);
                    const month = ymd.substring(4, 6);
                    const day = ymd.substring(6, 8);

                    const date = new Date(year, parseInt(month) - 1, parseInt(day));
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const dayName = days[date.getDay()];

                    return `${year}-${month}-${day} (${dayName})`;
                },

                formatFileSize(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
                },

                getYmdString(date) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}${month}${day}`;
                },

                getPreviousDay() {
                    const ymdNum = this.ymd; // YYYYMMDD 형식
                    const year = parseInt(ymdNum.substring(0, 4));
                    const month = parseInt(ymdNum.substring(4, 6));
                    const day = parseInt(ymdNum.substring(6, 8));

                    const date = new Date(year, month - 1, day);
                    date.setDate(date.getDate() - 1);
                    return this.getYmdString(date);
                },

                getNextDay() {
                    const ymdNum = this.ymd; // YYYYMMDD 형식
                    const year = parseInt(ymdNum.substring(0, 4));
                    const month = parseInt(ymdNum.substring(4, 6));
                    const day = parseInt(ymdNum.substring(6, 8));

                    const date = new Date(year, month - 1, day);
                    date.setDate(date.getDate() + 1);
                    return this.getYmdString(date);
                }
            }
        }
    </script>
</main>
</body>
</html>
