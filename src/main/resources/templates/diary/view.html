<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>일기 상세 - KalpaDB</title>
    <!-- QuillJS CSS (읽기 전용 스타일링) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
<main layout:fragment="content">
    <div x-data="diaryDetail()" x-init="init()" class="space-y-6">
        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-12">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <p class="text-base-content/60 mt-4">로딩 중...</p>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="alert alert-error" x-cloak>
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/>
            </svg>
            <p x-text="error"></p>
        </div>

        <!-- 일기 상세 -->
        <div x-show="!loading && diary" class="space-y-6" x-cloak>
            <!-- 헤더 카드 -->
            <div class="card bg-base-100 shadow-md">
                <div class="card-body">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h1 class="text-3xl font-bold text-base-content" x-text="formatDateWithDay(diary.ymd)"></h1>
                            <p class="text-base-content/60 mt-2" x-text="diary.summary || '(요약 없음)'"></p>
                        </div>
                        <div class="flex gap-2 flex-shrink-0">
                            <a :href="'/diary/' + diary.ymd + '/edit'" class="btn btn-sm btn-primary">수정</a>
                            <button @click="deleteDiary()" class="btn btn-sm btn-error" type="button">삭제</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 내용 카드 -->
            <div class="card bg-base-100 shadow">
                <div class="card-body p-6">
                    <div class="ql-editor prose prose-sm max-w-none" x-html="diary.content || '<p>(내용 없음)</p>'"></div>
                </div>
            </div>

            <!-- 첨부파일 섹션 -->
            <div class="card bg-base-100 shadow">
                <div class="card-body">
                    <h3 class="card-title text-lg">📎 첨부파일</h3>

                    <template x-if="attachedFiles.length > 0">
                        <div class="space-y-2">
                            <template x-for="file in attachedFiles" :key="file.fileId">
                                <div class="flex items-center justify-between bg-base-200 p-3 rounded border border-base-300">
                                    <div class="flex-1 min-w-0">
                                        <a :href="'/api/file/download/' + file.fileId"
                                           class="link link-primary font-medium truncate"
                                           x-text="file.orgFileName">
                                        </a>
                                        <p class="text-xs text-base-content/60" x-text="'(' + formatFileSize(file.fileSize) + ')'"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template x-if="attachedFiles.length === 0">
                        <p class="text-base-content/60">첨부파일이 없습니다.</p>
                    </template>
                </div>
            </div>

            <!-- 뒤로가기 버튼 -->
            <div class="flex justify-start">
                <a th:href="@{/diary}" class="link link-primary flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
                    </svg>
                    목록으로
                </a>
            </div>
        </div>
    </div>

    <script>
        function diaryDetail() {
            const ymd = window.location.pathname.split('/').pop();

            return {
                ymd: ymd,
                diary: null,
                attachedFiles: [],
                loading: true,
                error: '',

                async init() {
                    try {
                        const response = await fetch(`/api/diary/${this.ymd}`);
                        if (!response.ok) {
                            throw new Error('일기를 불러올 수 없습니다.');
                        }
                        const data = await response.json();
                        this.diary = data.data || data;

                        // 첨부파일 로드
                        await this.loadAttachedFiles();
                    } catch (err) {
                        this.error = err.message;
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },

                async loadAttachedFiles() {
                    try {
                        console.log(`첨부파일 로드 시작: /api/diary/${this.ymd}/files`);
                        const response = await fetch(`/api/diary/${this.ymd}/files`);
                        if (response.ok) {
                            const data = await response.json();
                            console.log('첨부파일 로드 성공:', data);
                            this.attachedFiles = data.data || [];
                            console.log(`로드된 파일 개수: ${this.attachedFiles.length}`);
                        } else {
                            console.warn(`첨부파일 조회 실패: ${response.status}`);
                        }
                    } catch (err) {
                        console.error('파일 로드 실패:', err);
                    }
                },

                async deleteDiary() {
                    if (confirm('정말 삭제하시겠습니까? (첨부파일은 보존됩니다)')) {
                        try {
                            const response = await fetch(`/api/diary/${this.ymd}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });
                            if (response.ok) {
                                alert('삭제되었습니다.');
                                window.location.href = '/diary';
                            } else {
                                throw new Error('삭제에 실패했습니다.');
                            }
                        } catch (err) {
                            alert(err.message);
                            console.error(err);
                        }
                    }
                },

                formatDate(ymd) {
                    if (!ymd || ymd.length !== 8) return ymd;
                    return `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
                },

                formatDateWithDay(ymd) {
                    if (!ymd || ymd.length !== 8) return ymd;

                    const year = ymd.substring(0, 4);
                    const month = ymd.substring(4, 6);
                    const day = ymd.substring(6, 8);

                    const date = new Date(year, parseInt(month) - 1, parseInt(day));
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const dayName = days[date.getDay()];

                    return `${year}-${month}-${day} (${dayName})`;
                },

                formatFileSize(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
                }
            }
        }
    </script>
</main>
</body>
</html>
