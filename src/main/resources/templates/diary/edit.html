<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>일기 수정 - KalpaDB</title>
    <!-- QuillJS CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
<main layout:fragment="content">
    <div x-data="diaryEdit()" x-init="init()">
        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-600">로딩 중...</p>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <p x:text="error"></p>
        </div>

        <!-- 폼 -->
        <div x-show="!loading" class="space-y-6">
            <!-- 페이지 헤더 -->
            <h2 class="text-3xl font-bold text-gray-800">📝 일기 수정</h2>

            <!-- 날짜 & 요약 (한 줄) -->
            <div class="grid grid-cols-5 gap-4">
                <!-- 날짜 (20%, 수정 불가) -->
                <div class="col-span-1">
                    <label for="ymd" class="block text-sm font-medium text-gray-700 mb-2">
                        날짜
                    </label>
                    <input
                        type="date"
                        id="ymd"
                        x-model="form.ymd"
                        disabled
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100"
                    >
                </div>

                <!-- 요약 (80%) -->
                <div class="col-span-4">
                    <label for="summary" class="block text-sm font-medium text-gray-700 mb-2">
                        요약 (선택사항)
                    </label>
                    <input
                        type="text"
                        id="summary"
                        x-model="form.summary"
                        @keydown.tab="focusQuillEditor($event)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="한 줄 요약"
                        maxlength="300"
                    >
                </div>
            </div>

            <!-- 내용 (QuillJS 에디터) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    내용
                </label>
                <div id="quill-editor" class="bg-white border border-gray-300 rounded-lg w-full"></div>
                <input type="hidden" id="content" x-model="form.content">
            </div>

            <!-- 첨부파일 -->
            <div class="border-t pt-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">📎 첨부파일</h3>

                <!-- 기존 파일 목록 -->
                <div x-show="existingFiles.length > 0" class="mb-6">
                    <h4 class="text-sm font-medium text-gray-700 mb-3">기존 파일</h4>
                    <div class="space-y-2">
                        <template x-for="file in existingFiles" :key="file.fileId">
                            <div class="flex items-center justify-between bg-gray-50 p-3 rounded border border-gray-200">
                                <div class="flex-1">
                                    <p class="text-sm text-gray-700" x-text="file.orgFileName"></p>
                                    <p class="text-xs text-gray-500" x-text="'(' + formatFileSize(file.fileSize) + ')'"></p>
                                </div>
                                <button
                                    type="button"
                                    @click="removeExistingFile(file.fileId)"
                                    class="text-red-500 hover:text-red-700 text-sm font-medium"
                                >
                                    삭제
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 새 파일 업로드 -->
                <div class="mb-4">
                    <label for="file-input" class="block text-sm font-medium text-gray-700 mb-2">
                        새 파일 추가
                    </label>
                    <div class="flex items-center gap-2">
                        <input
                            type="file"
                            id="file-input"
                            @change="addNewFiles($event)"
                            multiple
                            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                    </div>
                    <p class="text-xs text-gray-500 mt-1">여러 파일을 선택할 수 있습니다</p>
                </div>

                <!-- 추가된 파일 목록 -->
                <div x-show="newFiles.length > 0" class="space-y-2">
                    <h4 class="text-sm font-medium text-gray-700">추가된 파일</h4>
                    <template x-for="(file, index) in newFiles" :key="index">
                        <div class="flex items-center justify-between bg-blue-50 p-3 rounded border border-blue-200">
                            <div class="flex-1">
                                <p class="text-sm text-gray-700" x-text="file.name"></p>
                                <p class="text-xs text-gray-500" x-text="'(' + formatFileSize(file.size) + ')'"></p>
                            </div>
                            <button
                                type="button"
                                @click="removeNewFile(index)"
                                class="text-red-500 hover:text-red-700 text-sm font-medium"
                            >
                                삭제
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- 버튼 -->
            <div class="flex gap-3 pt-4">
                <a :href="APP_CTX + '/diary/new?ymd=' + getPreviousDay()" class="px-6 py-2 bg-gray-400 text-white font-semibold rounded-lg hover:bg-gray-500 active:bg-gray-600 transition-colors inline-flex items-center">← 이전일</a>
                <button @click="save()" :disabled="saving" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:bg-blue-800 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors flex-grow">
                    <span x:text="saving ? '저장 중...' : '수정'">수정</span>
                </button>
                <a :href="APP_CTX + '/diary'" class="px-6 py-2 bg-gray-500 text-white font-semibold rounded-lg hover:bg-gray-600 active:bg-gray-700 transition-colors inline-flex items-center">취소</a>
                <a :href="APP_CTX + '/diary/new?ymd=' + getNextDay()" class="px-6 py-2 bg-gray-400 text-white font-semibold rounded-lg hover:bg-gray-500 active:bg-gray-600 transition-colors inline-flex items-center">다음일 →</a>
            </div>
        </div>
    </div>

    <!-- QuillJS JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <style>
        #quill-editor {
            border: 1px solid #d1d5db !important;
            border-radius: 0.5rem !important;
        }

        /* Toolbar 스타일 */
        .ql-toolbar.ql-snow {
            border-top-left-radius: 0.5rem !important;
            border-top-right-radius: 0.5rem !important;
            background-color: #f9fafb !important;
            border: 1px solid #d1d5db !important;
            border-bottom: 1px solid #d1d5db !important;
        }

        /* Toolbar 버튼 활성 상태 */
        .ql-toolbar.ql-snow button:hover,
        .ql-toolbar.ql-snow button.ql-active {
            color: #06b6d4 !important;
        }

        .ql-toolbar.ql-snow button.ql-active .ql-stroke {
            stroke: #06b6d4 !important;
        }

        .ql-toolbar.ql-snow button.ql-active .ql-fill {
            fill: #06b6d4 !important;
        }

        /* Editor 컨테이너 */
        .ql-container.ql-snow {
            border-bottom-left-radius: 0.5rem !important;
            border-bottom-right-radius: 0.5rem !important;
            border: none !important;
            font-size: 12px !important;
        }

        .ql-editor {
            padding: 12px !important;
            min-height: 350px !important;
            max-height: 400px !important;
            overflow-y: auto !important;
            font-size: 12px !important;
        }

        .ql-editor.ql-blank::before {
            color: #9ca3af !important;
        }

        /* 이미지 스타일 */
        .ql-editor img {
            max-width: 100%;
            height: auto;
        }
    </style>
    <script>
        let quillEditor;

        function diaryEdit() {
            const pathname = window.location.pathname.replace(APP_CTX, '');
            const ymd = pathname.split('/')[2];

            return {
                ymd: ymd,
                form: {
                    ymd: ymd,
                    summary: '',
                    content: ''
                },
                existingFiles: [],
                newFiles: [],
                deletedFileIds: [],
                loading: true,
                saving: false,
                error: '',

        async init() {
                    if (quillEditor) return;

                    // QuillJS 에디터 초기화
                    quillEditor = new Quill('#quill-editor', {
                        theme: 'snow',
                        placeholder: '일기 내용을 입력하세요',
                        modules: {
                            toolbar: [
                                'bold', 'italic', 'underline', 'strike',
                                { 'list': 'ordered'}, { 'list': 'bullet' },
                                { 'header': [2, 3, false] },
                                { 'color': [] },
                                { 'align': [] },
                                'image',
                                'clean'
                            ]
                        }
                    });

                    // 내용 변경 감지
                    quillEditor.on('text-change', () => {
                        this.form.content = quillEditor.root.innerHTML;
                        document.getElementById('content').value = this.form.content;
                    });

                    try {
                        const response = await fetch(`${APP_CTX}/api/diary/${this.ymd}`);
                        if (!response.ok) {
                            throw new Error('일기를 불러올 수 없습니다.');
                        }
                        const data = await response.json();
                        const diary = data.data || data;

                        // YYYYMMDD를 YYYY-MM-DD로 변환
                        const ymdFormatted = diary.ymd ?
                            `${diary.ymd.substring(0, 4)}-${diary.ymd.substring(4, 6)}-${diary.ymd.substring(6, 8)}` :
                            this.ymd;

                        this.form = {
                            ymd: ymdFormatted,
                            summary: diary.summary || '',
                            content: diary.content || ''
                        };

                        // QuillJS 에디터에 내용 설정
                        quillEditor.root.innerHTML = this.form.content;
                        document.getElementById('content').value = this.form.content;

                        // 첨부파일 로드
                        console.log('첨부파일 로드 시작...');
                        await this.loadAttachedFiles();
                        console.log('첨부파일 로드 완료:', this.existingFiles);
                    } catch (err) {
                        this.error = err.message;
                        console.error('초기화 오류:', err);
                    } finally {
                        this.loading = false;
                    }
                },

                async loadAttachedFiles() {
                    try {
                        console.log('파일 로드 URL:', `/api/diary/${this.ymd}/files`);
                        const response = await fetch(`${APP_CTX}/api/diary/${this.ymd}/files`);
                        if (response.ok) {
                            const data = await response.json();
                            this.existingFiles = data.data || [];
                            console.log('파일 로드 성공:', this.existingFiles);
                        } else {
                            console.log('파일 로드 응답 실패:', response.status);
                        }
                    } catch (err) {
                        console.error('파일 로드 실패:', err);
                    }
                },

                focusQuillEditor(e) {
                    e.preventDefault();
                    if (quillEditor) {
                        quillEditor.focus();
                    }
                },

                addNewFiles(event) {
                    const files = event.target.files;
                    for (let file of files) {
                        this.newFiles.push(file);
                    }
                    // 파일 선택 초기화
                    event.target.value = '';
                },

                removeNewFile(index) {
                    this.newFiles.splice(index, 1);
                },

                removeExistingFile(fileId) {
                    const index = this.existingFiles.findIndex(f => f.fileId === fileId);
                    if (index > -1) {
                        this.existingFiles.splice(index, 1);
                        if (!this.deletedFileIds.includes(fileId)) {
                            this.deletedFileIds.push(fileId);
                        }
                    }
                },

                formatFileSize(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
                },

                getYmdString(date) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}${month}${day}`;
                },

                getPreviousDay() {
                    const ymdNum = this.ymd; // YYYYMMDD 형식
                    const year = parseInt(ymdNum.substring(0, 4));
                    const month = parseInt(ymdNum.substring(4, 6));
                    const day = parseInt(ymdNum.substring(6, 8));

                    const date = new Date(year, month - 1, day);
                    date.setDate(date.getDate() - 1);
                    return this.getYmdString(date);
                },

                getNextDay() {
                    const ymdNum = this.ymd; // YYYYMMDD 형식
                    const year = parseInt(ymdNum.substring(0, 4));
                    const month = parseInt(ymdNum.substring(4, 6));
                    const day = parseInt(ymdNum.substring(6, 8));

                    const date = new Date(year, month - 1, day);
                    date.setDate(date.getDate() + 1);
                    return this.getYmdString(date);
                },

                async save() {
                    if (!this.form.content || this.form.content === '<p><br></p>') {
                        alert('내용을 입력하세요.');
                        return;
                    }

                    this.saving = true;
                    try {
                        // 날짜를 YYYYMMDD 형식으로 변환 (YYYY-MM-DD -> YYYYMMDD)
                        const ymdFormatted = this.form.ymd.replace(/-/g, '');

                        const formData = new FormData();
                        formData.append('summary', this.form.summary);
                        formData.append('content', this.form.content);

                        // 새 파일 추가
                        for (let file of this.newFiles) {
                            formData.append('newFiles', file);
                        }

                        // 수정 시 삭제할 파일 ID 목록 추가
                        if (this.deletedFileIds.length > 0) {
                            formData.append('deletedFileIds', JSON.stringify(this.deletedFileIds));
                        }

                        const response = await fetch(`${APP_CTX}/api/diary/${ymdFormatted}`, {
                            method: 'PUT',
                            body: formData,
                            credentials: 'include'
                        });

                        if (!response.ok) {
                            const errorData = await response.json();
                            throw new Error(errorData.message || '저장에 실패했습니다.');
                        }

                        alert('저장되었습니다.');
                        window.location.href = `${APP_CTX}/diary/${ymdFormatted}`;
                    } catch (err) {
                        this.error = err.message;
                        alert(err.message);
                        console.error(err);
                    } finally {
                        this.saving = false;
                    }
                }
            }
        }
    </script>
</main>
</body>
</html>
