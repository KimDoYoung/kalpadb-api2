<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>일기 - KalpaDB</title>
</head>
<body>
<main layout:fragment="content">
    <div x-data="diaryList()" x-init="init()">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">📖 일기</h2>
            <a th:href="@{/diary/new}" class="btn-primary">새 일기 작성</a>
        </div>

        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-600">로딩 중...</p>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <p x:text="error"></p>
        </div>

        <!-- 일기 목록 -->
        <template x-if="!loading && diaries && diaries.length > 0">
            <div class="space-y-4">
                <template x-for="(diary, idx) in diaries" :key="idx">
                    <div class="card hover:shadow-lg transition">
                        <div class="flex items-center gap-3">
                            <div class="flex-1">
                                <a :href="APP_CTX + '/diary/' + diary.ymd" class="block">
                                    <h3 class="text-lg font-bold text-gray-800" x-text="formatDateWithDay(diary.ymd)"></h3>
                                    <p class="text-gray-600 line-clamp-1" x-text="diary.summary || diary.content || '내용 없음'"></p>
                                </a>
                            </div>
                            <a :href="APP_CTX + '/diary/' + diary.ymd + '/edit'" class="btn-primary flex-shrink-0">수정</a>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- 빈 상태 -->
        <template x-if="!loading && (!diaries || diaries.length === 0)">
            <div class="text-center py-12">
                <p class="text-gray-600 text-lg mb-4">아직 작성한 일기가 없습니다.</p>
                <a th:href="@{/diary/new}" class="btn-primary">첫 번째 일기 작성하기</a>
            </div>
        </template>
    </div>

    <script>
        function diaryList() {
            return {
                diaries: [],
                loading: true,
                error: '',

                init() {
                    if (this.diaries.length > 0 || this._initialized) return;
                    this._initialized = true;

                    fetch(APP_CTX + '/api/diary')
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('일기를 불러올 수 없습니다.');
                            }
                            return response.json();
                        })
                        .then(data => {
                            console.log('API 응답:', data);
                            let diaryList = [];

                            // data.data가 배열인 경우
                            if (Array.isArray(data.data)) {
                                diaryList = data.data;
                            }
                            // data.data.content가 배열인 경우 (페이지네이션)
                            else if (data.data && Array.isArray(data.data.content)) {
                                diaryList = data.data.content;
                                console.log('페이징 정보:', {
                                    totalElements: data.data.totalElements,
                                    totalPages: data.data.totalPages,
                                    currentPage: data.data.number,
                                    pageSize: data.data.size
                                });
                            }
                            // data가 배열인 경우
                            else if (Array.isArray(data)) {
                                diaryList = data;
                            }

                            console.log('최종 일기 목록:', diaryList);
                            this.diaries = diaryList;
                        })
                        .catch(err => {
                            this.error = err.message;
                            console.error('API 에러:', err);
                        })
                        .finally(() => {
                            this.loading = false;
                        });
                },

                formatDate(ymd) {
                    // YYYYMMDD 형식을 YYYY-MM-DD 형식으로 변환
                    if (!ymd || ymd.length !== 8) return ymd;
                    return `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
                },

                formatDateWithDay(ymd) {
                    // YYYYMMDD 형식을 YYYY-MM-DD (요일) 형식으로 변환
                    if (!ymd || ymd.length !== 8) return ymd;

                    const year = ymd.substring(0, 4);
                    const month = ymd.substring(4, 6);
                    const day = ymd.substring(6, 8);

                    const date = new Date(year, parseInt(month) - 1, parseInt(day));
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const dayName = days[date.getDay()];

                    return `${year}-${month}-${day} (${dayName})`;
                }
            }
        }
    </script>
</main>
</body>
</html>
