<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>일기 - KalpaDB</title>
</head>
<body>
<main layout:fragment="content">
    <div x-data="diaryList()" x-init="init()" class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="card bg-base-100 shadow-md">
            <div class="card-body">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-3xl font-bold text-base-content">📖 일기</h1>
                        <p class="text-base-content/60 mt-1">일상을 기록합니다</p>
                    </div>
                    <a th:href="@{/diary/new}" class="btn btn-primary gap-2">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        새 일기 작성
                    </a>
                </div>
            </div>
        </div>

        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-12">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <p class="text-base-content/60 mt-4">로딩 중...</p>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="alert alert-error" x-cloak>
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l4-4m0 0l4 4m-4-4l-4-4" />
            </svg>
            <p x-text="error"></p>
        </div>

        <!-- 일기 목록 -->
        <template x-if="!loading && diaries && diaries.length > 0">
            <div class="space-y-3">
                <template x-for="(diary, idx) in diaries" :key="idx">
                    <div class="card bg-base-100 shadow hover:shadow-lg transition-shadow">
                        <div class="card-body p-4">
                            <div class="flex items-center justify-between">
                                <a :href="'/diary/' + diary.ymd" class="flex-1 min-w-0 cursor-pointer">
                                    <h3 class="text-lg font-bold text-base-content truncate" x-text="formatDateWithDay(diary.ymd)"></h3>
                                    <p class="text-base-content/60 line-clamp-1 text-sm" x-text="diary.summary || diary.content || '내용 없음'"></p>
                                </a>
                                <a :href="'/diary/' + diary.ymd + '/edit'" class="btn btn-sm btn-ghost flex-shrink-0 ml-2">수정</a>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- 빈 상태 -->
        <template x-if="!loading && (!diaries || diaries.length === 0)">
            <div class="text-center py-16">
                <div class="text-6xl mb-4">📝</div>
                <p class="text-base-content/60 text-lg mb-6">아직 작성한 일기가 없습니다.</p>
                <a th:href="@{/diary/new}" class="btn btn-primary gap-2">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    첫 번째 일기 작성하기
                </a>
            </div>
        </template>
    </div>

    <script>
        function diaryList() {
            return {
                diaries: [],
                loading: true,
                error: '',

                init() {
                    if (this.diaries.length > 0 || this._initialized) return;
                    this._initialized = true;

                    fetch('/api/diary')
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('일기를 불러올 수 없습니다.');
                            }
                            return response.json();
                        })
                        .then(data => {
                            console.log('API 응답:', data);
                            let diaryList = [];

                            // data.data가 배열인 경우
                            if (Array.isArray(data.data)) {
                                diaryList = data.data;
                            }
                            // data.data.content가 배열인 경우 (페이지네이션)
                            else if (data.data && Array.isArray(data.data.content)) {
                                diaryList = data.data.content;
                                console.log('페이징 정보:', {
                                    totalElements: data.data.totalElements,
                                    totalPages: data.data.totalPages,
                                    currentPage: data.data.number,
                                    pageSize: data.data.size
                                });
                            }
                            // data가 배열인 경우
                            else if (Array.isArray(data)) {
                                diaryList = data;
                            }

                            console.log('최종 일기 목록:', diaryList);
                            this.diaries = diaryList;
                        })
                        .catch(err => {
                            this.error = err.message;
                            console.error('API 에러:', err);
                        })
                        .finally(() => {
                            this.loading = false;
                        });
                },

                formatDate(ymd) {
                    // YYYYMMDD 형식을 YYYY-MM-DD 형식으로 변환
                    if (!ymd || ymd.length !== 8) return ymd;
                    return `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
                },

                formatDateWithDay(ymd) {
                    // YYYYMMDD 형식을 YYYY-MM-DD (요일) 형식으로 변환
                    if (!ymd || ymd.length !== 8) return ymd;

                    const year = ymd.substring(0, 4);
                    const month = ymd.substring(4, 6);
                    const day = ymd.substring(6, 8);

                    const date = new Date(year, parseInt(month) - 1, parseInt(day));
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const dayName = days[date.getDay()];

                    return `${year}-${month}-${day} (${dayName})`;
                }
            }
        }
    </script>
</main>
</body>
</html>
