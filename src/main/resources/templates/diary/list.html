<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>일기 - KalpaDB</title>
</head>
<body>
<main layout:fragment="content">
    <div x-data="diaryList()" x-init="init()">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">📔 일기</h2>
            <a th:href="@{/diary/new}" class="btn-primary">새 일기 작성</a>
        </div>

        <!-- 로딩 상태 -->
        <div x-show="loading" class="text-center py-8">
            <p class="text-gray-600">로딩 중...</p>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <p x:text="error"></p>
        </div>

        <!-- 일기 목록 -->
        <div x-show="!loading && diaries.length > 0" class="space-y-4">
            <template x-for="diary in diaries" :key="diary.ymd">
                <a :href="'/diary/' + diary.ymd" class="card hover:shadow-lg transition block">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800" x-text="formatDate(diary.ymd)"></h3>
                            <p class="text-gray-600 mt-2 line-clamp-2" x-text="diary.summary || diary.content || '내용 없음'"></p>
                        </div>
                        <span class="text-sm text-gray-500 flex-shrink-0">
                            <span x-text="diary.ymd"></span>
                        </span>
                    </div>
                </a>
            </template>
        </div>

        <!-- 빈 상태 -->
        <div x-show="!loading && diaries.length === 0" class="text-center py-12">
            <p class="text-gray-600 text-lg mb-4">아직 작성한 일기가 없습니다.</p>
            <a th:href="@{/diary/new}" class="btn-primary">첫 번째 일기 작성하기</a>
        </div>
    </div>

    <script>
        function diaryList() {
            return {
                diaries: [],
                loading: true,
                error: '',

                async init() {
                    try {
                        const response = await fetch('/api/diary');
                        if (!response.ok) {
                            throw new Error('일기를 불러올 수 없습니다.');
                        }
                        const data = await response.json();
                        this.diaries = data.data || [];
                    } catch (err) {
                        this.error = err.message;
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },

                formatDate(ymd) {
                    // YYYYMMDD 형식을 YYYY-MM-DD 형식으로 변환
                    if (!ymd || ymd.length !== 8) return ymd;
                    return `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
                }
            }
        }
    </script>
</main>
</body>
</html>
