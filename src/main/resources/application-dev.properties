# Development Environment
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Thymeleaf - 파일 시스템에서 직접 로드 (DevConfig.java에서 설정)
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# DevTools - 자동 재시작 및 LiveReload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates/,src/main/resources/static/

# Logging
logging.level.kr.co.kalpa.api=DEBUG


# folders
file.upload.base-dir=./kalpadb/data
file.upload.attach-files-dir=${file.upload.base-dir}/attach_files
file.temp-dir=${file.upload.base-dir}/temp