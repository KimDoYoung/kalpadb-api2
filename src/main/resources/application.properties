# Application
spring.application.name=kalpadb-api

# Server
server.port=8080

# Database - MariaDB 10.3.35
spring.datasource.url=jdbc:mariadb://jskn.iptime.org:3306/jskndb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=kdy987
spring.datasource.password=kalpa987!
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA - MariaDB Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=MyVeryLongAndSecureJWTSecretKeyFor2026WithMinimum32Chars!@#$%
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging
logging.level.kr.co.kalpa.api=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Jackson
spring.jackson.time-zone=Asia/Seoul

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Multipart File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
