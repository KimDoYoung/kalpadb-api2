plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'kr.co.kalpa'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Thymeleaf Layout Dialect
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    // Thymeleaf Spring Security Extras
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // MariaDB
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.2'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // UUID Creator
    implementation 'com.github.f4b6a3:uuid-creator:5.3.7'

    // Test dependencies
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 외부 Tomcat에 WAR 배포 시 내장 Tomcat 제외
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // Spring Boot DevTools (개발 중 자동 재시작)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Korean Lunar Calendar
    implementation 'com.github.usingsky:KoreanLunarCalendar:0.3.1'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

bootWar {
    archiveFileName = 'kalpadb-api.war'
}

tasks.named('war') {
    enabled = false
}

tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', project.findProperty('profile') ?: 'dev'
}

task generateBcryptHash(type: JavaExec) {
    mainClass = 'kr.co.kalpa.api.GenerateBcryptHash'
    classpath = sourceSets.test.runtimeClasspath
}
